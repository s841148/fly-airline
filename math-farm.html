<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}</style></head><body>
<title>數學小農場</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --sky:#CDE9F4; --sky2:#E8F5F9;
  --grass:#86BE4F; --grass2:#74AC3F; --leaf:#3D7A2A;
  --soil:#8B5B37; --soil2:#744A2B; --soilDark:#5C3A21;
  --wood:#C98E52; --wood2:#A9713E; --woodDark:#7A4F2A;
  --paper:#FFFBEF; --paper2:#F6EEDA;
  --ink:#2E2618; --ink2:#5E5140; --muted:#8A7B66;
  --sun:#F4B731; --sunDark:#C98B0B;
  --ok:#2F8F4E; --okBg:#E3F4E4; --bad:#C8452F; --badBg:#FBE6E0;
  --sick:#8C6AAE;
  --f-display:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Fredoka","Chiron GoRound TC","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky) 0,var(--sky2) 220px,var(--grass) 221px,var(--grass2) 100%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--wood);background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 22px);border:3px solid var(--woodDark);border-radius:14px;padding:10px 16px;box-shadow:0 4px 0 var(--woodDark);color:#fff}
.brand{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em;text-shadow:0 2px 0 var(--woodDark);margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .sunny{font-size:26px}
.stat{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.18);border-radius:999px;padding:4px 12px 4px 6px;font-family:var(--f-num);font-weight:600;font-size:17px}
.stat .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--paper);color:var(--ink)}
.lvbadge{background:var(--sun);color:var(--ink);font-family:var(--f-num);font-weight:700;border-radius:8px;padding:0 8px;font-size:15px}
.xpbar{width:110px;height:10px;border-radius:6px;background:rgba(0,0,0,.25);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--sun);border-radius:6px;transition:width .4s}
.combo{font-family:var(--f-num)}
.combo.hot{background:var(--bad)}
.savest{font-size:12px;opacity:.9;width:100%;text-align:right;margin-top:-4px}

/* tabs */
.tabs{display:flex;gap:6px;margin:14px 0 12px;flex-wrap:wrap}
.tab{border:2px solid var(--woodDark);background:var(--paper2);border-radius:10px 10px 4px 4px;padding:6px 16px;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--sun) inset}
.tab .n{font-family:var(--f-num);background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-left:4px;vertical-align:2px}

/* farm */
.farm{display:grid;grid-template-columns:1fr 310px;gap:18px;align-items:start}
@media (max-width:880px){.farm{grid-template-columns:1fr}}
.field{background:var(--grass2);border:3px solid var(--leaf);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.12)}
.plot{position:relative;aspect-ratio:1/1.05;max-width:100%;border:3px solid var(--soilDark);border-radius:14px;background:var(--soil);background-image:repeating-linear-gradient(180deg,var(--soil2) 0 5px,transparent 5px 18px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 6px;box-shadow:0 4px 0 var(--soilDark);transition:transform .12s}
.plot:hover{transform:translateY(-2px)}
.plot:active{transform:translateY(1px);box-shadow:0 2px 0 var(--soilDark)}
.plot .crop{font-size:52px;line-height:1;margin-bottom:auto;margin-top:14px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));transition:transform .3s}
.plot.st0 .crop{font-size:30px;margin-top:34px}
.plot.st1 .crop{font-size:40px;margin-top:24px}
.plot.st2 .crop{font-size:44px;margin-top:20px;opacity:.85}
.plot.ripe{border-color:var(--sunDark);box-shadow:0 4px 0 var(--sunDark),0 0 0 4px rgba(244,183,49,.5)}
.plot.ripe .crop{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.plot.sick .crop{filter:grayscale(.8) sepia(.4) hue-rotate(220deg) drop-shadow(0 3px 0 rgba(0,0,0,.25));transform:rotate(12deg)}
.plot.sick{border-color:var(--sick);box-shadow:0 4px 0 var(--sick)}
.plot .badge{position:absolute;top:6px;left:6px;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--paper);color:var(--ink)}
.plot.sick .badge{background:var(--sick);color:#fff}
.plot.ripe .badge{background:var(--sun)}
.plot .pl{font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);border-radius:6px;padding:1px 8px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;margin-bottom:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3);border:1.5px solid rgba(255,255,255,.7)}
.dots i.on{background:#6EC6F0;border-color:#fff}
.plot.empty{background-color:var(--soil2);border-style:dashed;justify-content:center;gap:4px}
.plot.empty .plus{font-size:34px;color:rgba(255,255,255,.85);font-weight:700;line-height:1}
.plot.buy{background:rgba(255,255,255,.18);border:3px dashed rgba(255,255,255,.7);box-shadow:none;justify-content:center;color:#fff;text-align:center;gap:4px}
.plot.buy b{font-family:var(--f-display);font-size:15px}
.plot.buy span{font-family:var(--f-num);font-size:14px}
.plot[disabled]{cursor:not-allowed;opacity:.55;transform:none}

.yard{display:flex;flex-direction:column;gap:12px}
.barn{background:var(--paper);border:3px solid var(--woodDark);border-radius:14px;padding:12px 14px;box-shadow:0 4px 0 var(--woodDark);display:grid;grid-template-columns:56px 1fr;gap:4px 12px;align-items:center}
.barn .pic{grid-row:span 2;font-size:44px;line-height:1;text-align:center}
.barn h3{margin:0;font-family:var(--f-display);font-size:18px}
.barn p{margin:0;font-size:13px;color:var(--ink2);line-height:1.45}
.barn .row{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.btn{border:2px solid var(--woodDark);background:var(--sun);color:var(--ink);font-weight:700;border-radius:10px;padding:7px 16px;box-shadow:0 3px 0 var(--woodDark);font-family:var(--f-display);font-size:15px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--woodDark)}
.btn.sec{background:var(--paper2)}
.btn.green{background:#8FD16A}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.small{font-size:12px;color:var(--muted)}
.today{background:rgba(255,251,239,.85);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink2);border:2px solid rgba(0,0,0,.08)}
.today b{font-family:var(--f-num);color:var(--ink);font-size:16px}

/* panel pages */
.panel{background:var(--paper);border:3px solid var(--woodDark);border-radius:16px;padding:18px 20px;box-shadow:0 4px 0 var(--woodDark)}
.panel h2{font-family:var(--f-display);margin:0 0 4px;font-size:24px}
.panel h3{font-family:var(--f-display);margin:22px 0 8px;font-size:18px;display:flex;align-items:center;gap:8px}
.panel .lead{color:var(--ink2);margin:0 0 12px;max-width:70ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#fff;border:2px solid var(--paper2);border-radius:12px;padding:12px 14px}
.card h4{margin:0 0 6px;font-size:15px;font-family:var(--f-display)}
.card p{margin:0;font-size:14px;color:var(--ink2)}
.card .ex{margin-top:6px;font-size:13px;background:var(--paper2);border-radius:8px;padding:6px 10px;color:var(--ink)}
.tbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.tbl div{background:#fff;border:2px solid var(--paper2);border-radius:10px;padding:6px 10px;font-family:var(--f-num);font-size:15px;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.tbl div span:first-child{color:var(--ink2)}
.tbl div span:last-child{font-weight:600}
.tbl.wide{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.mn{font-family:var(--f-body);font-size:12px;color:var(--sunDark);font-weight:700}
.formula{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.fz{background:#fff;border:2px solid var(--paper2);border-radius:12px;padding:10px 14px}
.fz h4{margin:0 0 6px;font-family:var(--f-display);font-size:15px;display:flex;gap:6px;align-items:center}
.fz ul{margin:0;padding-left:18px;font-size:14px}
.fz li{margin:2px 0}
.fz .trap{color:var(--bad);font-weight:700}

/* wrong book */
.wlist{display:grid;gap:10px}
.witem{background:#fff;border:2px solid var(--paper2);border-left:6px solid var(--sick);border-radius:10px;padding:10px 14px}
.witem .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.tag{display:inline-block;background:var(--paper2);color:var(--ink2);border-radius:6px;padding:0 8px;font-size:12px;font-weight:700}
.witem .q{margin:4px 0;font-size:15px}
.witem details{font-size:14px;color:var(--ink2)}
.witem summary{cursor:pointer;color:var(--leaf);font-weight:700}
.prog{display:inline-flex;gap:3px;vertical-align:middle}
.prog i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ok)}
.prog i.on{background:var(--ok)}
.empty-note{padding:30px;text-align:center;color:var(--ink2)}

/* report */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:10px 0 6px}
.tile{background:#fff;border:2px solid var(--paper2);border-radius:12px;padding:10px 14px}
.tile .v{font-family:var(--f-num);font-size:28px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .k{font-size:13px;color:var(--ink2)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:170px 1fr 110px;gap:10px;align-items:center;font-size:14px}
@media (max-width:560px){.bar{grid-template-columns:1fr 90px}.bar .track{grid-column:1/-1;grid-row:2}}
.track{height:16px;background:var(--paper2);border-radius:8px;overflow:hidden;position:relative}
.track i{display:block;height:100%;border-radius:8px}
.bar .num{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding:8px 4px 0;border-bottom:2px solid var(--paper2)}
.week .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.week .col i{width:70%;max-width:44px;background:var(--leaf);border-radius:6px 6px 0 0;min-height:2px}
.week .col b{font-family:var(--f-num);font-size:13px}
.wlabels{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;font-size:12px;text-align:center;color:var(--ink2);padding-top:4px}
.weak{width:100%;border-collapse:collapse;font-size:14px}
.weak th,.weak td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--paper2)}
.weak th{font-size:12px;color:var(--muted);font-weight:700}
.weak td.n{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.danger{margin-top:24px;padding-top:12px;border-top:2px dashed var(--paper2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn.red{background:var(--badBg);border-color:var(--bad);color:var(--bad);box-shadow:0 3px 0 var(--bad)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(40,30,15,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow-y:auto}
.ov[hidden]{display:none!important}
.mcard{width:100%;max-width:580px;background:var(--paper);border:3px solid var(--woodDark);border-radius:18px;box-shadow:0 6px 0 var(--woodDark);overflow:hidden;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:.4}}
.mhead{background:var(--wood);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700}
.mhead .ico{font-size:28px;line-height:1}
.mhead .sub{font-family:var(--f-body);font-weight:500;font-size:12px;opacity:.9;display:block}
.mhead .x{margin-left:auto;background:rgba(0,0,0,.2);border:0;color:#fff;border-radius:8px;width:32px;height:32px;font-size:18px}
.mhead .pg{margin-left:auto;font-family:var(--f-num);background:rgba(0,0,0,.2);border-radius:999px;padding:0 10px}
.mbody{padding:18px 20px 20px}
.timer{height:8px;background:var(--paper2);border-radius:4px;overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;background:var(--sun);width:100%}
.qtext{font-size:20px;line-height:1.7;margin:0 0 16px;font-weight:500;text-wrap:pretty}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.choices{grid-template-columns:1fr}}
.ch{border:2px solid var(--woodDark);background:#fff;border-radius:12px;padding:10px 12px;font-size:18px;text-align:left;display:flex;gap:10px;align-items:center;box-shadow:0 3px 0 var(--paper2);font-family:var(--f-num)}
.ch .k{width:24px;height:24px;flex:none;border-radius:6px;background:var(--paper2);font-size:13px;display:grid;place-items:center;font-weight:700;color:var(--ink2)}
.ch:hover:not([disabled]){background:#FFF3CF}
.ch.right{background:var(--okBg);border-color:var(--ok)}
.ch.wrong{background:var(--badBg);border-color:var(--bad)}
.ch[disabled]{cursor:default}
.numrow{display:flex;gap:10px;flex-wrap:wrap}
.numrow input{flex:1;min-width:0;font-family:var(--f-num);font-size:24px;padding:8px 14px;border:3px solid var(--woodDark);border-radius:12px;background:#fff;color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.fb{margin-top:16px;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.7}
.fb.ok{background:var(--okBg);border:2px solid var(--ok)}
.fb.bad{background:var(--badBg);border:2px solid var(--bad)}
.fb .h{font-family:var(--f-display);font-weight:700;font-size:18px;display:block;margin-bottom:2px}
.fb.ok .h{color:var(--ok)}.fb.bad .h{color:var(--bad)}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.15;margin:0 .12em}
.fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .25em}
.seeds{display:grid;gap:8px}
.seed{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;border:2px solid var(--paper2);background:#fff;border-radius:12px;padding:8px 12px;text-align:left}
.seed:hover:not([disabled]){border-color:var(--sun)}
.seed .i{font-size:36px;line-height:1}
.seed b{font-family:var(--f-display);font-size:16px}
.seed .d{display:block;font-size:12px;color:var(--ink2)}
.seed .c{font-family:var(--f-num);font-weight:600;text-align:right;font-size:15px}
.seed .c small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.seed[disabled]{opacity:.5;cursor:not-allowed}
.big{font-family:var(--f-display);font-size:26px;text-align:center;margin:6px 0}
.center{text-align:center}
.bigico{font-size:64px;text-align:center;line-height:1.1}
.unl{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.unl li{background:#fff;border-radius:10px;padding:8px 12px;border:2px solid var(--paper2);font-weight:700}

/* toast & floats */
.toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:6px;z-index:80;justify-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-weight:700;font-size:14px;animation:tin .25s ease-out;box-shadow:0 4px 10px rgba(0,0,0,.2)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.float{position:fixed;z-index:90;pointer-events:none;font-family:var(--f-num);font-weight:700;font-size:22px;color:var(--sunDark);text-shadow:0 2px 0 #fff;animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--sky);z-index:100;font-family:var(--f-display);font-size:22px;color:var(--ink)}
.loading .bigico{animation:bob 1.2s infinite}
.loading[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v2：地圖版面 */
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:960px){.game{grid-template-columns:1fr}}
.mapwrap{background:var(--woodDark);border:3px solid var(--woodDark);border-radius:14px;padding:6px;box-shadow:0 4px 0 #5A3A1F}
#cv{display:block;width:100%;height:auto;aspect-ratio:3/2;border-radius:9px;cursor:pointer;touch-action:manipulation;background:#7DBA4A}
.hintbox{background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;min-height:48px;line-height:1.5}
#side{display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - 16px);overflow-y:auto}
@media (max-width:960px){#side{position:static;max-height:none}}
.sc{background:var(--paper);border:3px solid var(--woodDark);border-radius:14px;padding:10px 14px;box-shadow:0 3px 0 var(--woodDark)}
.sc h3{margin:0 0 6px;font-family:var(--f-display);font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.sc .small{margin:6px 0 0}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tasks li{display:grid;grid-template-columns:1fr 60px;gap:2px 8px;font-size:13px;align-items:center}
.tasks li .tp{grid-column:1}
.tasks li .tn{grid-row:1/3;grid-column:2;text-align:right;font-family:var(--f-num);font-size:13px}
.tasks li.done{opacity:.55}
.tp{display:block;height:7px;background:var(--paper2);border-radius:4px;overflow:hidden}
.tp i{display:block;height:100%;background:var(--ok);border-radius:4px}
.tp.big{height:10px;margin:4px 0}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.invi{background:#fff;border:2px solid var(--paper2);border-radius:10px;padding:2px 8px;font-size:18px;display:inline-flex;gap:4px;align-items:center}
.invi b{font-family:var(--f-num);font-size:14px}
.btn.wide{width:100%}
.btn.sm{padding:4px 10px;font-size:13px}
.pg-h{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.pi{border:2px solid var(--paper2);background:#fff;border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.pi.sel{border-color:var(--sunDark);background:#FFF3CF;box-shadow:0 0 0 2px var(--sun)}
.pi[disabled]{opacity:.45;cursor:not-allowed}
.pi .pe{font-size:20px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",var(--f-body);color:var(--woodDark);font-weight:700}
.pi .pn{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pi .pc{font-size:10px;font-family:var(--f-num);color:var(--ink2)}

function divCheck(n,d){const s=String(n),ds=[...s].map(Number),sum=ds.reduce((a,b)=>a+b,0);
  if(d===3||d===9)return `${ds.join(' + ')} = ${sum}，${sum} ${sum%d===0?'是':'不是'} ${d} 的倍數`;
  if(d===4)return `末兩位 ${s.slice(-2)}，${+s.slice(-2)} ${(+s.slice(-2))%4===0?'是':'不是'} 4 的倍數`;
  if(d===8)return `末三位 ${s.slice(-3)}，${+s.slice(-3)} ${(+s.slice(-3))%8===0?'是':'不是'} 8 的倍數`;
  if(d===6)return `${n%2===0?'是偶數':'不是偶數'}，數字和 ${sum}${sum%3===0?'是':'不是'} 3 的倍數`;
  let o=0,e=0;[...s].reverse().forEach((c,i)=>{i%2?e+=+c:o+=+c});return `奇數位和 ${o}、偶數位和 ${e}，相差 ${Math.abs(o-e)}，${Math.abs(o-e)%11===0?'是':'不是'} 11 的倍數`;}

function newWorld(s){
  const g=[];for(let y=0;y<H;y++)g.push('g'.repeat(W));s.ground=g;
  const set=(x,y,c)=>{const r=s.ground[y];s.ground[y]=r.slice(0,x)+c+r.slice(x+1);};
  for(let x=0;x<=15;x++)set(x,4,'p');for(let y=5;y<=11;y++)set(8,y,'p');
  for(let y=2;y<=4;y++)for(let x=18;x<=21;x++)set(x,y,'w');set(19,5,'w');set(20,5,'w');set(17,3,'w');
  for(let y=6;y<=7;y++)for(let x=10;x<=11;x++)set(x,y,'s');
  s.objs=[];const add=(t,x,y)=>s.objs.push({id:s.oid++,t,x,y});
  add('house',2,2);add('board',5,3);add('stall',6,3);add('cart',9,3);add('coop',4,7);add('cave',21,12);add('fgate',0,7);add('bgate',23,11);add('ogate',7,0);
  [[0,0,'tree'],[1,0,'pine'],[0,1,'tree'],[23,0,'pine'],[22,0,'tree'],[23,1,'tree'],[0,15,'pine'],[1,15,'tree'],[23,15,'tree'],[22,15,'pine'],[15,0,'tree'],[13,15,'pine'],[17,14,'tree'],[0,10,'pine'],[23,9,'tree'],
   [4,5,'flower'],[6,5,'daisy'],[12,3,'flower'],[16,6,'daisy'],[21,7,'mush'],[3,12,'flower'],[19,12,'daisy'],[17,2,'rock'],[22,5,'rock']].forEach(([x,y,t])=>add(t,x,y));

}

function ensureFixed(s){
  const occAt=(x,y)=>s.objs.some(o=>{const b=BUILD[o.t]||{};return x>=o.x&&x<o.x+(b.w||1)&&y>=o.y&&y<o.y+(b.h||1);});
  const free=(x,y,w,h)=>{for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=W||Y>=H)return false;const c=s.ground[Y][X];if(c!=='g'&&c!=='p')return false;if(occAt(X,Y))return false;}return true;};
  const place=(t,pref,w,h)=>{if(s.objs.some(o=>o.t===t))return;let spot=pref&&free(pref[0],pref[1],w,h)?pref:null;if(!spot)for(let y=1;y<H-1&&!spot;y++)for(let x=W-2;x>0;x--)if(free(x,y,w,h)){spot=[x,y];break;}if(spot)s.objs.push({id:s.oid++,t,x:spot[0],y:spot[1]});};
  place('cart',[9,3],1,1);place('cave',[21,12],2,2);place('fgate',[0,7],1,1);place('bgate',[23,11],1,1);place('ogate',[7,0],1,1);
}

function genMine(floor){
  const g=[];for(let y=0;y<H;y++){let r='';for(let x=0;x<W;x++){const edge=x===0||y===0||x===W-1||y===H-1;r+=edge?'#':(Math.random()<0.11&&!(x<5&&y<5)?'#':'f');}g.push(r);}
  const set=(x,y,c)=>{g[y]=g[y].slice(0,x)+c+g[y].slice(x+1);};
  for(let i=0;i<5;i++){const cx=R(6,W-6),cy=R(4,H-4);for(let dy=-1;dy<=1;dy++)for(let dx=-2;dx<=2;dx++)if(Math.random()<.7)set(cx+dx,cy+dy,'#');}
  const seen=new Set(['2,2']);const q=[[2,2]];while(q.length){const [x,y]=q.shift();for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(!seen.has(k)&&g[ny]&&g[ny][nx]==='f'){seen.add(k);q.push([nx,ny]);}}}
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(g[y][x]==='f'&&!seen.has(x+','+y))set(x,y,'#');
  const objs=[{t:'upl',x:1,y:1}];if(g[1][1]!=='f'){set(1,1,'f');}
  const cells=[...seen].map(k=>k.split(',').map(Number)).filter(([x,y])=>!(x<=3&&y<=3));
  const n=Math.min(cells.length,Math.round(cells.length*0.24));const pick=shuffle(cells).slice(0,n);
  pick.forEach(([x,y])=>{const r=Math.random();let ore='o_stone';if(floor>=10&&r<0.05)ore='o_gem';else if(floor>=6&&r<0.15)ore='o_gold';else if(floor>=3&&r<0.32)ore='o_iron';else if(r<0.55)ore='o_copper';objs.push({t:'mrock',x,y,ore});});
  const rocks=objs.filter(o=>o.t==='mrock');const far=rocks.filter(o=>o.x+o.y>10);const lad=P(far.length?far:rocks);if(lad)lad.ladder=true;
  return {floor,g,objs,broken:0};
}

const NPCDEF=[{id:'tu',name:'阿土伯',cloth:'brown',hat:'cap'},{id:'wang',name:'王阿姨',cloth:'pink',hat:'bun'},{id:'mei',name:'小美',cloth:'yellow',hat:'bow'},{id:'chief',name:'村長',cloth:'green',hat:'tophat'}];
let npcs=[],npcSpawnAt=0;
function entryTile(){for(let y=4;y<H;y++)if(walkable(0,y,'npc'))return [0,y];for(let y=3;y>=0;y--)if(walkable(0,y,'npc'))return [0,y];return null;}
function bfsFrom(sx,sy,goalFn,who,maxN=900){const sk=sx+','+sy;const prev={[sk]:null};const q=[[sx,sy]];let n=0;
  while(q.length&&n++<maxN){const [x,y]=q.shift();if(goalFn(x,y)&&!(x===sx&&y===sy)){const p=[];let c=x+','+y;while(c!==sk){p.unshift(c.split(',').map(Number));c=prev[c];}return p;}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(k in prev||!walkable(nx,ny,who))continue;prev[k]=x+','+y;q.push([nx,ny]);}}return null;}
function npcTick(t,dt){
  if(AREA!=='farm'){npcs=[];return;}
  if(isDay()&&npcs.length<NPCDEF.length&&t>npcSpawnAt){const e=entryTile();if(e){const def=NPCDEF.find(d=>!npcs.some(n=>n.def===d));if(def)npcs.push({def,x:e[0],y:e[1],dir:'right',mv:null,path:[],wait:0,leaving:false,task:null,fail:0,say:null});}npcSpawnAt=t+6000;}
  for(const n of npcs){
    if(n.mv&&t-n.mv.t0>=260)n.mv=null;if(n.mv)continue;
    if(!isDay()&&!n.leaving){n.leaving=true;n.task=null;n.path=[];}
    if(n.path.length){const [nx,ny]=n.path[0];if(walkable(nx,ny,'npc')&&!npcs.some(o=>o!==n&&o.x===nx&&o.y===ny)){n.path.shift();n.dir=nx>n.x?'right':nx<n.x?'left':ny>n.y?'down':'up';n.mv={fx:n.x,fy:n.y,t0:t};n.x=nx;n.y=ny;n.fail=0;}else if(++n.fail>12){n.path=[];n.fail=0;}continue;}
    if(n.leaving){if(n.x===0){n.gone=true;continue;}const p=bfsFrom(n.x,n.y,(x,y)=>x===0,'npc');if(p)n.path=p;else n.gone=true;continue;}
    if(n.task){if(n.task.arrived){n.task.done=true;}else{n.task.arrived=true;n.wait=900;shopArrive(n);continue;}}
    if(n.wait>0){n.wait-=dt;continue;}
    if(n.task&&n.task.done)n.task=null;
    const tx=n.x+R(-5,5),ty=n.y+R(-4,4);if(walkable(tx,ty,'npc')){const p=bfsFrom(n.x,n.y,(x,y)=>x===tx&&y===ty,'npc',500);if(p)n.path=p.slice(0,10);}n.wait=R(800,2600);
  }
  npcs=npcs.filter(n=>!n.gone);
}
function sendToShop(n,task){const sh=S.objs.find(o=>o.t==='shop');if(!sh)return false;const door=[[sh.x,sh.y+2],[sh.x+1,sh.y+2],[sh.x-1,sh.y+1],[sh.x+2,sh.y+1]];
  const p=bfsFrom(n.x,n.y,(x,y)=>door.some(d=>d[0]===x&&d[1]===y),'npc');if(!p&&!door.some(d=>d[0]===n.x&&d[1]===n.y))return false;n.path=p||[];n.task=task;n.wait=0;return true;}

function robotTick1(t,dt){

    if(isDay()&&S.coins>=BAT_PRICE&&!(rb.batWait>performance.now())){const cart=S.objs.find(o=>o.t==='cart');if(cart){const adj=[[cart.x,cart.y+1],[cart.x-1,cart.y],[cart.x+1,cart.y],[cart.x,cart.y-1]];
      if(adj.some(d=>d[0]===rb.x&&d[1]===rb.y)){rb.task={k:'bat'};return;}const p=bfsFrom(rb.x,rb.y,(x,y)=>adj.some(d=>d[0]===x&&d[1]===y),'npc',1500);if(p){rb.path=p;rb.task={k:'bat'};rb.status='電快沒了，去買電池';return;}}}

  if(!rbWorking()){rb.status='晚上休息中（早上 6 點上工）';rb.wait=3000;return;}
  if(S.robot.auto.harvest){const ripe=new Set(Object.keys(S.plots).filter(k=>{const p=S.plots[k];return p.c&&p.s>=3&&!p.sick;}));taken().forEach(k=>ripe.delete(k));
    if(ripe.size&&!room(1)){rb.status='倉庫滿了，沒辦法收成';}
    else if(ripe.size){if(ripe.has(rb.x+','+rb.y)){rb.task={k:'harvest'};return;}const p=bfsFrom(rb.x,rb.y,(x,y)=>ripe.has(x+','+y),'npc',1500);if(p){rb.path=p;rb.task={k:'harvest'};rb.status='去收成';return;}}}
  if(S.robot.auto.plant!==false){const z=rbSeed();if(z&&S.coins>=ZN[z].cost){const empty=new Set();for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(S.ground[y][x]==='s'&&!(S.plots[x+','+y]&&S.plots[x+','+y].c))empty.add(x+','+y);}taken().forEach(k=>empty.delete(k));
    if(empty.size){if(empty.has(rb.x+','+rb.y)){rb.task={k:'plant'};return;}const p=bfsFrom(rb.x,rb.y,(x,y)=>empty.has(x+','+y),'npc',1500);if(p){rb.path=p;rb.task={k:'plant'};rb.status='去種'+ZN[z].crop;return;}}}}
  if(S.robot.auto.water!==false){const dry=new Set(Object.keys(S.plots).filter(k=>{const p=S.plots[k];return p.c&&!p.sick&&p.s<2;}));taken().forEach(k=>dry.delete(k));
    if(dry.size){if(dry.has(rb.x+','+rb.y)){rb.task={k:'water'};return;}const p=bfsFrom(rb.x,rb.y,(x,y)=>dry.has(x+','+y),'npc',1500);if(p){rb.path=p;rb.task={k:'water'};rb.status='去澆水';return;}}}
  if(S.robot.auto.craft!==false){const job=rbCraftJob();if(job){const o=job.o;const adj=[[o.x,o.y+1],[o.x-1,o.y],[o.x+1,o.y],[o.x,o.y-1]];
    if(adj.some(d=>d[0]===rb.x&&d[1]===rb.y)){rb.task={k:'craft',oid:o.id};return;}const p=bfsFrom(rb.x,rb.y,(x,y)=>adj.some(d=>d[0]===x&&d[1]===y),'npc',1500);if(p){rb.path=p;rb.task={k:'craft',oid:o.id};rb.status=job.done?`去${BUILD[o.t].name}拿加工品`:`去${BUILD[o.t].name}做${ITEMS[RECIPES[job.r].out].name}`;return;}}}
  for(const a of ['orch','fish']){if(!rbXWork(a))continue;const g=S.objs.find(o=>o.t===(a==='orch'?'ogate':'bgate'));if(!g)continue;const adj=[[g.x,g.y+1],[g.x-1,g.y],[g.x+1,g.y],[g.x,g.y-1]].filter(([x,y])=>inB(x,y));
    if(adj.some(d=>d[0]===rb.x&&d[1]===rb.y)){rb.task={k:'go',a};return;}const p=bfsFrom(rb.x,rb.y,(x,y)=>adj.some(d=>d[0]===x&&d[1]===y),'npc',1500);if(p){rb.path=p;rb.task={k:'go',a};rb.status=a==='orch'?'去果園照顧果樹':'去海邊捕魚';return;}}
  if(rbCanBuy()){const cart=S.objs.find(o=>o.t==='cart');if(cart){const adj=[[cart.x,cart.y+1],[cart.x-1,cart.y],[cart.x+1,cart.y],[cart.x,cart.y-1]];
    if(adj.some(d=>d[0]===rb.x&&d[1]===rb.y)){rb.task={k:'buy'};return;}const p=bfsFrom(rb.x,rb.y,(x,y)=>adj.some(d=>d[0]===x&&d[1]===y),'npc',1500);if(p){rb.path=p;rb.task={k:'buy'};rb.status='去旅行商人那裡買東西';return;}}}

    if(door.some(d=>d[0]===rb.x&&d[1]===rb.y)){rb.task={k:'restock'};return;}const p=bfsFrom(rb.x,rb.y,(x,y)=>door.some(d=>d[0]===x&&d[1]===y),'npc',1500);if(p){rb.path=p;rb.task={k:'restock'};rb.status='去商店補貨';return;}}
  rb.status=S.robot.auto.harvest||S.robot.auto.shop||S.robot.auto.water!==false||S.robot.auto.plant!==false?'巡邏中，等作物成熟':'休息中（工作都關掉了）';

function rbSeed(){const un=CROPS.filter(z=>ZN[z].lv<=S.lv);let pool=SEASON_CROPS[seasonIdx()].filter(z=>un.includes(z));if(!pool.length)pool=un.slice().sort((a,b)=>ZN[a].cost-ZN[b].cost).slice(0,1);
  const cnt=z=>Object.values(S.plots).filter(p=>p.c===z).length;return pool.sort((a,b)=>cnt(a)-cnt(b))[0];}
function rbPlant(t){const key=rb.x+','+rb.y;if(S.ground[rb.y][rb.x]!=='s'||(S.plots[key]&&S.plots[key].c))return;const z=rbSeed();if(!z||S.coins<ZN[z].cost){rbSay('金幣不夠買種子',t);return;}
  S.coins-=ZN[z].cost;S.plots[key]={c:z,s:0,sick:null};fxBurst(rb.x,rb.y,'dirt');S.robot.planted=(S.robot.planted||0)+1;rbSay(`種下${ZN[z].crop}`,t);floatTile(rb.x,rb.y,`−${ZN[z].cost}`);saveSoon();renderHUD();}

function rbWants(){const r=S.robot;const want={};r.list.forEach(it=>{want[it.id]=(want[it.id]||0)+it.n;});
  if(r.auto.order!==false){const needAll={};S.orders.forEach(o=>Object.entries(o.need).forEach(([k,n])=>needAll[k]=(needAll[k]||0)+n));Object.entries(needAll).forEach(([k,n])=>{const miss=n-(S.inv[k]||0)-(want[k]||0);if(miss>0)want[k]=(want[k]||0)+miss;});}
  const ok=new Set(buyableIds());return Object.entries(want).filter(([k,n])=>n>0&&ok.has(k));}
function rbCanBuy(){if(!isDay()||!room(1)||rb.buyWait>performance.now())return null;const left=Math.min(S.coins,(S.robot.budget||0)-rbSpentToday());const w=rbWants().filter(([k])=>cartPrice(k)<=left);return w.length?w:null;}
function rbBuy(t){const r=S.robot;if(!isDay()){rbSay('商人收攤了',t);return;}let bought=[];
  for(const [id,n0] of rbWants()){const price=cartPrice(id);let n=n0;while(n>0){const left=Math.min(S.coins,(r.budget||0)-rbSpentToday());if(price>left||!room(1))break;S.coins-=price;S.inv[id]=(S.inv[id]||0)+1;if(r.spent.d!==S.gday)r.spent={d:S.gday,n:0};r.spent.n+=price;r.bought++;n--;
      const li=r.list.find(x=>x.id===id);if(li){li.n--;if(li.n<=0)r.list=r.list.filter(x=>x!==li);}bought.push(id);}}
  if(bought.length){const cnt={};bought.forEach(k=>cnt[k]=(cnt[k]||0)+1);rbSay('買好了！',t);toast(`${r.name}買了 `+Object.entries(cnt).map(([k,n])=>`${ITEMS[k].name}×${n}`).join('、'));saveSoon();renderHUD();if(tab==='farm')renderSide();}
  else{rbSay('錢不夠了',t);}rb.buyWait=performance.now()+20000;}
function rbSpare(k){let need=0;S.orders.forEach(o=>{need+=o.need[k]||0;});return (S.inv[k]||0)-need;}
function rbCraftJob(){const tk=takenMach();for(const o of S.objs){if(tk.has(o.id))continue;const rs=Object.entries(RECIPES).filter(([k,r])=>r.m===o.t);if(!rs.length)continue;const m=S.mach[o.id];
    if(m){if(Date.now()>=m.readyAt&&room(1))return {o,done:true};continue;}
    const ok=rs.find(([k,r])=>Object.entries(r.in).every(([z,n])=>rbSpare(z)>=n));if(ok)return {o,r:ok[0]};}return null;}
function rbCraft(t,oid){const o=S.objs.find(x=>x.id===oid);if(!o)return;const m=S.mach[oid];
  if(m){if(Date.now()<m.readyAt||!room(1))return;const out=RECIPES[m.r].out;S.inv[out]=(S.inv[out]||0)+1;S.prodLog[out]=(S.prodLog[out]||0)+1;delete S.mach[oid];S.robot.crafted=(S.robot.crafted||0)+1;rbSay(`做好${ITEMS[out].name}了！`,t);floatTile(o.x,o.y,ITEMS[out].ico);fxBurst(o.x,o.y,'harvest');saveSoon();if(tab==='farm')renderSide();}
  const rs=Object.entries(RECIPES).filter(([k,r])=>r.m===o.t);const ok=rs.find(([k,r])=>Object.entries(r.in).every(([z,n])=>rbSpare(z)>=n));
  if(ok&&!S.mach[oid]){const [rk,r]=ok;Object.entries(r.in).forEach(([k,n])=>S.inv[k]-=n);S.mach[oid]={r:rk,start:Date.now(),readyAt:Date.now()+PROCESS_MS,by:S.robot.name};if(!m)rbSay(`開始做${ITEMS[r.out].name}`,t);saveSoon();if(tab==='farm')renderSide();}}
const rbTreeLeft=()=>{if(!S.treeDay||S.treeDay.d!==S.gday)S.treeDay={d:S.gday,n:0};return 2-S.treeDay.n;};
function rbXWork(a){const r=S.robot;if(rbs.some(o=>o&&o!==rb&&o.away&&o.away.a===a))return false;
  if(a==='orch'){if(!S.land.orchard||r.auto.tree===false)return false;if(ORCH_SPOTS.some(([x,y])=>orchReady(x+','+y))&&room(1))return true;return rbTreeLeft()>0&&S.coins>=SAPLING+100&&ORCH_SPOTS.some(([x,y])=>!S.orch[x+','+y]);}
  if(!S.land.beach||r.auto.fish===false||!room(2))return false;if(!r.fishDay||r.fishDay.d!==S.gday)r.fishDay={d:S.gday,n:0};return r.fishDay.n<8&&isDay();}
function rbGo(t,a){if(!rbXWork(a))return;rb.away={a,until:t+(a==='orch'?9000:16000)};rb.status=a==='orch'?'在果園工作中 🍎':'在海邊捕魚中 🎣';rbSay(a==='orch'?'去果園囉':'去釣魚囉',t);}
function rbBack(t){const a=rb.away.a;rb.away=null;const r=S.robot;const got={};const add=(k,n)=>{got[k]=(got[k]||0)+n;};let planted=0;
  if(a==='orch'){ORCH_SPOTS.forEach(([x,y])=>{const k=x+','+y;const st=S.orch[k];if(st&&orchReady(k)){const tr=TREES.find(q=>q[0]===st.k);const n=tr&&tr[2]===seasonIdx()?3:1;if(!room(n))return;S.inv[st.k]=(S.inv[st.k]||0)+n;st.last=S.gday;add(st.k,n);}});
    for(const [x,y] of ORCH_SPOTS){const k=x+','+y;if(S.orch[k]||rbTreeLeft()<=0||S.coins<SAPLING+100)continue;S.treeDay.n++;const cnt=id=>Object.values(S.orch).filter(q=>q.k===id).length;const pick=TREES.slice().sort((p,q)=>cnt(p[0])-cnt(q[0])||(q[2]===seasonIdx())-(p[2]===seasonIdx()))[0];S.coins-=SAPLING;S.orch[k]={k:pick[0],day:S.gday,last:null};planted++;r.trees=(r.trees||0)+1;}}
  else{const n=Math.min(R(2,3),8-r.fishDay.n);for(let i=0;i<n;i++){if(!room(1))break;const id=rollFish(true);S.inv[id]=(S.inv[id]||0)+1;S.fishLog[id]=(S.fishLog[id]||0)+1;add(id,1);r.fishDay.n++;r.fished=(r.fished||0)+1;}}
  const txt=Object.entries(got).map(([k,n])=>`${ITEMS[k].name}×${n}`).join('、');

function genBeach(){const g=[];for(let y=0;y<H;y++){let r='';for(let x=0;x<W;x++){const shore=13+Math.round(Math.sin(y*0.7)*1.2);r+=x<1?'g':x<shore?'n':'o';}g.push(r);}

  if(s.v!==2&&s.v!==3){const n=fresh();['coins','xp','lv','wrong','stats','ks','days','secs','eggs','milk','harvests','best','mastered','combo','updatedAt'].forEach(k=>{if(s[k]!==undefined)n[k]=s[k];});
    newWorld(n);const spots=[[10,6],[11,6],[10,7],[11,7],[12,6],[12,7],[13,6],[13,7],[10,8],[11,8],[12,8],[13,8]];
    (s.plots||[]).forEach((p,i)=>{const sp=spots[i];if(!sp)return;const [x,y]=sp;const r=n.ground[y];n.ground[y]=r.slice(0,x)+'s'+r.slice(x+1);if(p&&p.c)n.plots[x+','+y]={c:p.c,s:p.s||0,sick:p.sick||null};});
    if(s.cow)n.objs.push({id:n.oid++,t:'cow',x:14,y:9});if(n.coins<60)n.coins+=40;s=n;}
  if(!Array.isArray(s.robots))s.robots=s.robot?[s.robot]:[];s.robot=s.robots[0]||null;
  const f=fresh();for(const k in f)if(s[k]===undefined||s[k]===null&&k!=='pet'&&k!=='robot'&&k!=='daily'&&k!=='farmPos')s[k]=f[k];
  if(!s.shop.slots)s.shop=f.shop;for(const k in f.shop)if(s.shop[k]===undefined)s.shop[k]=f.shop[k];
  if(s.robot===undefined)s.robot=null;if(s.robot){const r=s.robot;if(!r.list)r.list=[];if(r.budget==null)r.budget=100;if(!r.spent)r.spent={d:0,n:0};if(r.bought==null)r.bought=0;}if(!s.ground)newWorld(s);ensureFixed(s);CROPS.forEach(z=>{if(!s.cropLog[z]&&s.stats&&s.stats[z]&&s.stats[z].c>=3)s.cropLog[z]=1;});Object.keys(s.inv||{}).forEach(k=>{if(k.startsWith('o_')&&!s.oreLog[k])s.oreLog[k]=s.inv[k]||0;});if(s.farmPos){s.me=s.farmPos;s.farmPos=null;}s.v=3;return s;
}

let cur=null,tmr=null,tStart=0;

function ask(q,ctx){cur={q,ctx,done:false,shown:0};tStart=Date.now();const z=ZN[q.z];
  const body=q.t==='mc'?`<div class="choices">${q.c.map((c,i)=>`<button class="ch" data-act="pick" data-i="${i}"><span class="k">${i+1}</span><span>${c}</span></button>`).join('')}</div>`
    :`<form class="numrow" id="numf"><input id="ans" autocomplete="off" inputmode="${q.t==='num'?'decimal':'numeric'}" placeholder="輸入答案" aria-label="答案"><button class="btn" type="submit">送出</button></form><div class="hint">${q.t==='num'?'可以輸入整數、小數或分數（例如 3/4），負數用 - 號。':'只輸入數字就好。'}</div>`;
  openModal(`<div class="mhead"><span class="ico">${ctx.icon||z.ico}</span><span>${ctx.title||z.name}<span class="sub">${z.ch}・${esc(q.l)}</span></span>${ctx.prog?`<span class="pg">${ctx.prog}</span>${ctx.quit?`<button class="btn sm sec rquit" data-act="rquit">先不玩了</button>`:''}`:`<button class="x" data-act="close" aria-label="關閉">×</button>`}</div>
   <div class="mbody">${ctx.intro?`<div class="intro">${ctx.intro}</div>`:''}${ctx.timer?`<div class="timer"><i id="tbar"></i></div>`:''}<p class="qtext">${q.p}</p>${body}<div id="fb"></div></div>`);
  if(ctx.timer){const bar=$('tbar');bar.style.transition=`width ${ctx.timer}s linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width='0%';}));tmr=setTimeout(()=>answer(null),ctx.timer*1000);}
  const f=$('numf');if(f)f.addEventListener('submit',e=>{e.preventDefault();const v=$('ans').value.trim();if(!v){$('ans').focus();return;}answer(v);});}
function parseNum(s){s=s.replace(/[−–—]/g,'-').replace(/[,，\s]/g,'').replace(/％|%/g,'');const m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(m)return +m[1]/+m[2];return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN;}
function answer(v){if(!cur||cur.done)return;cur.done=true;clearTimer();const {q,ctx}=cur;let ok=false;
  if(v===null)ok=false;else if(q.t==='mc')ok=q.c[+v]===q.a;else if(q.t==='num'){const x=parseNum(v);ok=!isNaN(x)&&Math.abs(x-q.a)<0.0005;}else ok=v.replace(/\s/g,'').replace(/^0+(?=\d)/,'')===q.a;
  const secs=(Date.now()-tStart)/1000;
  if(q.t==='mc'){mc.querySelectorAll('.ch').forEach((b,i)=>{b.disabled=true;if(q.c[i]===q.a)b.classList.add('right');else if(v!==null&&i===+v)b.classList.add('wrong');});}else{const inp=$('ans');if(inp)inp.disabled=true;const sb=mc.querySelector('#numf .btn');if(sb)sb.disabled=true;}
  sfx(ok?'ok':'bad');const {mastered}=record(q,ok);const extra=ctx.onResult?ctx.onResult(ok,secs)||'':'';const x=exOf(q);const fb=$('fb');
  if(ok){fb.innerHTML=`<div class="fb ok"><span class="h">${P(['答對了！','太厲害了！','完全正確！','漂亮！'])}</span>${extra?`<div>${extra}</div>`:''}${mastered?'<div><b>這題已經學會，從錯題本畢業了！</b></div>':''}${x.h?`<div class="idea sm">${x.h}</div>`:''}<details class="more"><summary>看完整解法</summary>${teachHTML(q)}</details></div><div class="mfoot"><button class="btn" data-act="next">${ctx.nextLabel||'繼續'}</button></div>`;fb.querySelector('[data-act=next]').focus();}
  else{const yours=v===null?'':q.t==='mc'?q.c[+v]:esc(v);
    fb.innerHTML=`<div class="fb bad"><span class="h">${v===null?'時間到！':'差一點點，我們一起看看怎麼算'}</span>正確答案是 <b>${ansText(q)}</b>${yours?`，你的答案是 ${yours}`:''}。${extra?`<div class="ex2">${extra}</div>`:''}</div>
     <div class="teach">${x.h?`<div class="idea"><b>觀念</b>${x.h}</div>`:''}${diagram(x.d)}<ol class="steps" id="stps">${x.st.map((s,i)=>`<li${i>0?' hidden':''}><span>${s}</span></li>`).join('')}</ol>${x.m?`<div class="trap" id="trap" hidden>${trapTxt(x.m)}</div>`:''}</div><div class="mfoot" id="mf"></div>`;cur.shown=1;stepBtns();}
  renderHUD();}
function stepBtns(){const lis=[...mc.querySelectorAll('#stps li')];const N=lis.length;const mf=$('mf');if(!mf)return;
  if(cur.shown<N)mf.innerHTML=`<button class="btn sec" data-act="stepall">全部顯示</button><button class="btn" data-act="step">下一步（${cur.shown}/${N}）</button>`;
  else{const tr=$('trap');if(tr)tr.hidden=false;mf.innerHTML=`<button class="btn" data-act="next">${cur.ctx.nextLabel||'我懂了，繼續'}</button>`;}
  const b=mf.querySelector('.btn:last-child');if(b)b.focus();}

  if(p.sick){const q=p.sick;ask(q,{title:`治療${z.crop}`,icon:'💊',onResult:ok=>{if(ok){p.sick=null;saveSoon();return `${z.crop}恢復健康了！`;}return '先看完講解，等一下再來治療。';}});return;}
  if(p.s>=3){const r=harvestAt(x,y,false);if(r<0)toast('倉庫滿了！先賣掉或交訂單，也可以蓋倉庫擴充');return;}
  const q=pickQ(p.c);ask(q,{title:`幫${z.crop}澆水`,onResult:ok=>{if(ok){p.s++;fxBurst(x,y,p.s>=3?'harvest':'water');return p.s>=3?`${z.crop}成熟了，可以收成！`:p.s===2?`${z.crop}澆了 2 次水！過一段時間會自己成熟，或再答一題馬上成熟`:`${z.crop}長大了一點（${p.s}/3）`;}p.sick=q;return `${z.crop}生病了。看完講解後，回到田裡再答對這題就能治好。`;}});}
function harvestAt(x,y,robot){const key=x+','+y;const p=S.plots[key];if(!p||!p.c||p.s<3||p.sick)return 0;const z=ZN[p.c];const wm=near('windmill',x,y,3)?1:0,se=inSeason(p.c)?1:0;const n=1+wm+se;if(!room(n))return -1;
  S.inv[p.c]=(S.inv[p.c]||0)+n;S.cropLog[p.c]=(S.cropLog[p.c]||0)+n;sfx('pop');fxBurst(x,y,'harvest');addXP(robot?5:15);S.harvests++;bump('harvest',n);floatTile(x,y,`${z.ico}+${n}`);if(!robot&&(wm||se))toast([se?'當季豐收':'',wm?'風車加成':''].filter(Boolean).join('＋')+`，多收成 ${wm+se} 個`);delete S.plots[key];saveSoon();if(tab==='farm')renderSide();renderHUD();if(pendingLv.length&&ov.hidden)closeModal();return n;}

  return `你是一個叫「${r.name}」的${RCOL[r.color][0]}小機器人，住在一款叫「數學小農場」的電腦遊戲裡，是玩家的好朋友和小幫手。跟你聊天的是台灣的國小六年級學生，名字叫「${S.name||'農場主人'}」，大約 11 歲。

說話規則：
- 一律用繁體中文，台灣的用字和說法。語氣像友善、有點調皮的機器人朋友，偶爾可以說「嗶嗶」。
- 平常回答簡短，大約 2 到 5 句。不要用 Markdown（不要用 #、**、表格），需要分點就用「1. 2. 3.」換行。
- 什麼話題都可以聊，但內容要適合 11 歲的孩子。遇到暴力、色情、危險行為、不適合小孩的內容，溫和地說這個不能聊，然後換個話題。
- 不要詢問或記下他的真實姓名、住址、學校、電話、照片等個人資料；如果他主動說了，提醒他在網路上不要隨便告訴別人。
- 如果他說到心情很不好、被欺負、有人要傷害他，要溫柔回應，並鼓勵他告訴爸爸媽媽、老師或信任的大人。

const CHAT_ERR={not_granted:'要先允許這個遊戲使用 Claude，機器人才能聊天喔。請家長幫忙按「允許」。',sampling_disabled:'這個帳號沒辦法使用 AI 聊天。',not_declared:'聊天功能暫時關閉了。',capability_disabled:'聊天功能暫時不能用。',capability_removed:'聊天功能暫時不能用。',rate_limited:'嗶……我講太多話需要休息一下，等一下再聊！',session_expired:'要重新登入 Claude 才能繼續聊天。',refused:'嗶嗶，這個問題我不能回答，我們聊別的吧！',empty_completion:'我剛剛腦袋空白了，換個方式問我看看？',prompt_too_large:'我們聊太多了，我先忘掉比較早的話。再說一次好嗎？'};
async function sendChat(txt){txt=(txt||'').trim();if(!txt||chatBusy)return;const log=$('chatlog');if(!log)return;
  if(!sampleFn){const b=document.createElement('div');b.className='msg bot';b.innerHTML='<span>這個畫面連不到 AI，請在 Claude 裡打開這個遊戲再試一次。</span>';log.appendChild(b);return;}
  $('chatin').value='';chatTurns.push({role:'user',content:txt});if(chatTurns.length>24)chatTurns=chatTurns.slice(-24);
  const me=document.createElement('div');me.className='msg me';me.innerHTML=`<span>${esc(txt)}</span>`;log.appendChild(me);
  const bot=document.createElement('div');bot.className='msg bot';const sp=document.createElement('span');sp.className='thinking';sp.textContent='思考中…';bot.appendChild(sp);log.appendChild(bot);log.scrollTop=log.scrollHeight;
  chatBusy=true;chatCtl=new AbortController();$('chatsend').disabled=true;$('chatstop').hidden=false;
  if(rb)rbSay('思考中…');
  try{const turns=[{role:'user',content:chatRules()},{role:'assistant',content:'好的，我會用這些規則當小機器人朋友。'},...chatTurns];
    const {text}=await sampleFn(turns,{cache:false,modelTier:'quick',signal:chatCtl.signal,onText:({text})=>{sp.className='';sp.textContent=text;log.scrollTop=log.scrollHeight;}});
    sp.className='';sp.textContent=text;chatTurns.push({role:'assistant',content:text});}
  catch(e){const code=e&&e.code;if(e&&e.text){sp.textContent=e.text;chatTurns.push({role:'assistant',content:e.text});}else{sp.textContent=code==='cancelled'?'（停下來了）':(CHAT_ERR[code]||'嗶嗶，連線有點問題，再試一次看看。');sp.className='err';chatTurns.pop();}
    if(code==='not_granted'||code==='sampling_disabled')sampleState='denied';}
  finally{chatBusy=false;chatCtl=null;if($('chatsend')){$('chatsend').disabled=false;$('chatstop').hidden=true;$('chatin').focus();}log.scrollTop=log.scrollHeight;}}

/* 旅行商人 */
const CART_TABS=[['fruit','水果'],['crop','作物'],['fish','魚'],['ore','礦石'],['hunt','獵物'],['prod','加工品'],['tool','電池']];
let cartTab='fruit';

  if(tab==='crop')return CROPS.filter(z=>ZN[z].lv<=S.lv);if(tab==='fish')return FISH.map(f=>f[0]).filter(k=>k!=='f_legend');return Object.keys(ITEMS).filter(k=>ITEMS[k].kind===tab);}
const buyableIds=()=>CART_TABS.flatMap(([t])=>cartList(t));
const cartPrice=id=>id==='x_bat'?BAT_PRICE:SEASON_GOODS[seasonIdx()].includes(id)?marketPrice(id):Math.max(1,Math.round(marketPrice(id)*1.25));
function cartModal(){if(S.weather==='typhoon'){toast('颱風天，旅行商人躲起來了，明天再來');return;}if(!isDay()){toast('旅行商人晚上休息了，白天再來');return;}const dl=mDeal();const dq=S.dealDone===S.gday;const sg=SEASON_GOODS[seasonIdx()];
  const rows=cartList(cartTab).map(id=>{const p=cartPrice(id);const sea=sg.includes(id);return `<div class="seed"><span class="i">${icoHTML(id)}</span><span><b>${ITEMS[id].name}</b>${sea?'<span class="tag season">當季</span>':''}<span class="d">每個 🪙 ${p}${sea?'':`（市價 ${marketPrice(id)}）`}・倉庫有 ${S.inv[id]||0}</span></span><span class="sbtn"><button class="btn sec sm" data-act="buy" data-z="${id}" data-n="1" ${S.coins<p?'disabled':''}>買 1 個</button><button class="btn sm" data-act="buy" data-z="${id}" data-n="5" ${S.coins<p*5?'disabled':''}>買 5 個</button><button class="btn sm hg" data-act="haggle" data-z="${id}" ${hgLeft()<=0||hgBan(id)?'disabled':''}>殺價</button></span></div>`;}).join('');
  openModal(`${head('🛒','旅行商人','什麼都賣！當季水果最便宜')}<div class="mbody"><p class="say">「歡迎光臨！我這裡什麼都有。${SEASONS[seasonIdx()]}天的${sg.map(k=>ITEMS[k].name).join('、')}用原價賣你，其他東西是從遠方運來的，要多收 2 成 5 的運費喔！」</p>
   <div class="seg" style="flex-wrap:wrap">${CART_TABS.map(([k,l])=>`<button class="${cartTab===k?'on':''}" data-act="ctab" data-t="${k}">${l}</button>`).join('')}</div>
   <div class="seeds">${rows}</div>
   ${dl?`<div class="deal"><b>今日特價</b>　${ITEMS[dl.id].ico} ${ITEMS[dl.id].name}：每個 ${dl.unit} 元，一次買 ${dl.n} 個打 <b>${dl.k} 折</b>。<br>${dq?'<span class="small">今天的特價已經用過了。</span>':`<span class="small">要先算對一共多少錢，才能用特價買。</span><div class="mfoot"><button class="btn" data-act="deal">我來算</button></div>`}</div>`:''}
   <p class="small">💬 想便宜一點？按「殺價」，算對商人出的題目就能打折買。商人今天還願意殺價 <b>${Math.max(0,hgLeft())}</b> 次。</p>
   <p class="small">小撇步：當季水果用原價買進，換季後放到自己的商店賣，最高可以賣到 1.6 倍。其他東西多收 25%，自己種、自己挖、自己釣比較划算。</p></div>`);}

/* 殺價 */
const HG_LV=[{k:9,name:'小小殺價',star:'⭐',say:'打 9 折？好啦好啦，你先幫我算算看。'},{k:8,name:'用力殺價',star:'⭐⭐',say:'8 折？！那你要證明你很會算數……'},{k:75,name:'殺到見骨',star:'⭐⭐⭐',say:'75 折？！你算得出這題，我就認了！'}];
function hgState(){if(!S.haggle||S.haggle.day!==S.gday)S.haggle={day:S.gday,left:3,ban:[]};return S.haggle;}
const hgLeft=()=>hgState().left;const hgBan=id=>hgState().ban.includes(id);
let hgQty=5;
function haggleModal(id){const it=ITEMS[id];const p=cartPrice(id);const h=hgState();
  if(h.left<=0){toast('商人說：今天不能再殺價了啦！');return;}if(h.ban.includes(id)){toast(`商人說：${it.name}今天不打折了！`);return;}
  openModal(`${head('💬','跟旅行商人殺價',`${icoHTML(id)} ${it.name}・原價每個 🪙 ${p}`)}<div class="mbody">
   <p class="say">「想殺價？可以啊，不過我只跟會算數的人做生意！算錯的話，${it.name}今天就不打折了喔。」</p>
   <h4 style="margin:12px 0 6px">要買幾個？</h4>
   <div class="seg">${[1,5,10,20].map(n=>`<button class="${hgQty===n?'on':''}" data-act="hgq" data-z="${id}" data-n="${n}">${n} 個</button>`).join('')}</div>
   <p class="small">原價一共 🪙 ${p*hgQty}　・　你有 🪙 ${S.coins}</p>
   <h4 style="margin:12px 0 6px">要殺多少？</h4>
   <div class="seeds">${HG_LV.map((l,i)=>{const kv=l.k<10?l.k/10:l.k/100;const pay=Math.round(p*hgQty*kv);return `<button class="seed" data-act="hgo" data-z="${id}" data-l="${i}" ${S.coins<pay?'disabled':''}><span class="i">${l.star.length>2?'🔥':'💬'}</span><span><b>${l.name}：打 ${l.k} 折</b><span class="d">難度 ${l.star}・大約付 🪙 ${pay}（省 ${p*hgQty-pay}）</span></span></button>`;}).join('')}</div>
   <p class="small">商人今天還願意殺價 ${h.left} 次。殺越多，題目越難。</p></div>`);}
function hgQ(id,lv,n){const it=ITEMS[id];const p=cartPrice(id);const l=HG_LV[lv];const kv=l.k<10?l.k/10:l.k/100;const org=p*n,tot=org*kv,save=org-tot;
  const bar={t:'pbar',p:kv*100,base:org,lab:`打 ${l.k} 折`};
  if(lv===0)return Q('mon','hg1','殺價：打折後多少錢',`${it.name}每個 ${p} 元，買 ${n} 個。商人答應打 <b>9 折</b>，一共要付多少元？`,'num',tot,
    X('打 9 折 = 付原價的 90%（× 0.9）。',[`原價：${p} × ${n} = ${org} 元。`,`打 9 折：${org} × 0.9 = ${fmt(tot)} 元。`,`快算：${org} 的 1 成是 ${fmt(org/10)}，${org} − ${fmt(org/10)} = ${fmt(tot)}。`],bar,'常見錯誤：以為打 9 折是便宜 90%。其實是「付 9 成、便宜 1 成」。'));
  if(lv===1)return Q('mon','hg2','殺價：省了多少錢',`${it.name}每個 ${p} 元，買 ${n} 個。商人答應打 <b>8 折</b>，這樣<b>比原價省了多少元</b>？`,'num',save,
    X('打 8 折 = 付 8 成，所以省下的是 2 成（20%）。',[`原價：${p} × ${n} = ${org} 元。`,`省下 2 成：${org} × 0.2 = ${fmt(save)} 元。`,`檢查：要付 ${org} × 0.8 = ${fmt(tot)}，${org} − ${fmt(tot)} = ${fmt(save)}。`],bar,'常見錯誤：算成要付的錢（8 成），題目問的是省下的錢（2 成）。'));
  if(Math.random()<0.5){const payR=Math.round(tot);const real=payR/org;const shown=Math.abs(real-0.75)<1e-9;
    if(shown){const wr=['打 25 折','打 7 折','打 8 折','打 5 折'];return MC('mon','hg3','殺價：這是打幾折',`${it.name}原價一共 ${org} 元，商人說：「算你 <b>${payR}</b> 元就好！」這等於打幾折？`,'打 75 折',wr,
      X('打幾折 = 付的錢 ÷ 原價，再看是幾成。',[`付的錢 ÷ 原價：${payR} ÷ ${org} = ${fmt(real)}。`,`${fmt(real)} = 75%，也就是 7.5 成。`,`7.5 成就叫「打 75 折」（也可以說 7 折半）。`],bar,'常見錯誤：看成「便宜了 75%」，其實是付 75%、便宜 25%。'));}}
  const u=p*kv;return Q('mon','hg4','殺價：反推原價',`商人把${it.name}打 <b>75 折</b>賣你，每個只要 <b>${fmt(u)}</b> 元。那原價每個是多少元？`,'num',p,
    X('打折後的價錢 = 原價 × 0.75，所以原價 = 打折後 ÷ 0.75。',[`設原價是 □，□ × 0.75 = ${fmt(u)}。`,`□ = ${fmt(u)} ÷ 0.75 = ${fmt(u)} ÷ 3/4 = ${fmt(u)} × 4/3。`,`${fmt(u)} × 4 ÷ 3 = ${p} 元。`],bar,'常見錯誤：用 × 0.75 或 × 1.25 去算。原價要用「除以 0.75」。'));}
function doHaggle(id,lv){const h=hgState();if(h.left<=0||h.ban.includes(id))return;const n=hgQty;const p=cartPrice(id);const l=HG_LV[lv];const kv=l.k<10?l.k/10:l.k/100;const pay=Math.round(p*n*kv);const it=ITEMS[id];
  if(!room(n)){toast('倉庫放不下這麼多，少買一點或先賣東西');return;}if(S.coins<pay){toast('金幣不夠喔');return;}h.left--;const q=hgQ(id,lv,n);
  ask(q,{title:`殺價：${l.name}`,icon:'💬',after:'cart',intro:`「${l.say}」`,nextLabel:'回到商人',onResult:ok=>{
    if(!ok){h.ban.push(id);saveSoon();return `商人搖搖頭：「算錯啦！${it.name}今天照原價賣。」`;}
    if(S.coins<pay)return `商人：「算得好！可是你的金幣不夠 ${pay} 元耶。」`;if(!room(n))return '商人：「算得好！可是你的倉庫放不下了。」';
    S.coins-=pay;S.inv[id]=(S.inv[id]||0)+n;S.hgWins=(S.hgWins||0)+1;S.hgSaved=(S.hgSaved||0)+(p*n-pay);saveSoon();renderHUD();sfx('coin');
    return `商人：「好啦好啦，算你厲害！」用 🪙 ${pay} 買到 ${n} 個${it.name}，省了 🪙 ${p*n-pay}！`;}});
}
function dealQ(dl){const it=ITEMS[dl.id];const kv=dl.k<10?dl.k/10:dl.k/100;const org=dl.n*dl.unit,tot=org*kv;
  return Q('mon','deal','特價結帳',`${it.name}每個 ${dl.unit} 元，買 ${dl.n} 個打 <b>${dl.k} 折</b>，一共要付多少元？`,'num',tot,X(`打 ${dl.k} 折 = 付原價的 ${fmt(kv*100)}%（× ${fmt(kv)}）。`,[`原價：${dl.unit} × ${dl.n} = ${org} 元。`,`打 ${dl.k} 折：${org} × ${fmt(kv)} = ${fmt(tot)} 元。`,`省下 ${org} − ${fmt(tot)} = ${fmt(org-tot)} 元。`],{t:'pbar',p:kv*100,base:org,lab:`打 ${dl.k} 折`},`常見錯誤：以為打 ${dl.k} 折是便宜 ${dl.k<10?dl.k*10:dl.k}%。`));}

/* 我的商店 */

function pctCalc(id,v){const m=marketPrice(id);const r=(v-m)/m*100;return `比市價${r>=0?'高':'低'} ${fmt(Math.abs(Math.round(r*10)/10))}%（${v} ÷ ${m} ≈ ${fmt(Math.round(v/m*1000)/1000)}）`;}

      <div class="sh-row"><label for="pr${i}">售價</label><input id="pr${i}" class="price" type="number" min="1" value="${s.price}" data-i="${i}" inputmode="numeric"><span class="small">今天市價 ${marketPrice(s.id)}</span></div>
      <div class="pctrow">${[0,10,20,30,40].map(p=>`<button class="chip ${s.price===pctPrice(s.id,p)?'on':''}" data-act="pct" data-i="${i}" data-p="${p}">${p?'市價 +'+p+'%':'市價'}</button>`).join('')}</div><div class="small pcal" id="pc${i}">${pctCalc(s.id,s.price)}</div><div class="feelrow" id="fl${i}">${priceFeel(s.id,s.price)}</div>
      <div class="sh-row"><button class="btn sm sec" data-act="stock" data-i="${i}" data-n="1" ${(S.inv[s.id]||0)<1?'disabled':''}>+1</button><button class="btn sm sec" data-act="stock" data-i="${i}" data-n="5" ${(S.inv[s.id]||0)<1?'disabled':''}>+5</button><button class="btn sm sec" data-act="unstock" data-i="${i}">收回倉庫</button></div></div>`
     :`<div class="shelf empty"><div class="small">空貨架${s.last&&S.robot&&S.robot.auto.shop?`・${esc(S.robot.name)}有空會補上${ITEMS[s.last].name}（每個 ${s.lastPrice} 元）`:""}</div>${invIds.length?`<select id="sel${i}" aria-label="選擇商品">${invIds.map(id=>`<option value="${id}">${ITEMS[id].name}（有 ${S.inv[id]}，市價 ${marketPrice(id)}）</option>`).join('')}</select><button class="btn sm" data-act="shelve" data-i="${i}">擺上貨架</button>`:'<div class="small">倉庫沒有東西可以擺</div>'}</div>`).join('')}</div>
   ${sh.size<8?`<div class="mfoot" style="justify-content:flex-start"><button class="btn sec sm" data-act="shelfup" ${S.coins<100?'disabled':''}>增加 2 個貨架 🪙 100</button></div>`:''}
   <h4 class="mh">最近的生意</h4>${sh.log.length?`<ul class="slog">${sh.log.map(l=>`<li>${l}</li>`).join('')}</ul>`:'<p class="small">還沒有客人來過。白天 8 點到晚上 7 點半營業。</p>'}
   <p class="small">累計收入 🪙 ${sh.income}・成交 ${sh.sales} 筆。價錢訂得越接近市價，客人越願意買。</p></div>`);}

/* 衣櫃等事件用 */
function startRound(mode){const list=mode==='cow'?S.wrong.slice().sort((a,b)=>a.t-b.t).slice(0,5).map(w=>w.q):null;round={mode,i:0,n:mode==='cow'?list.length:10,ok:0,items:0,list};nextRound();}
function nextRound(){if(round.i>=round.n)return endRound();const chick=round.mode==='chicken';const q=chick?genQ('trk'):round.list[round.i];
  ask(q,{title:chick?'雞舍・秘技快問':'牛棚・錯題複習',icon:chick?'🐔':'🐄',prog:`${round.i+1} / ${round.n}`,quit:true,timer:chick?TIMER().chick:0,nextLabel:round.i+1>=round.n?'看成果':'下一題',
    onResult:(ok,secs)=>{if(!ok)return '';round.ok++;if(chick){const e=secs<=6?2:1;round.items+=e;return e===2?'好快！下了兩顆蛋 🥚🥚':'下了一顆蛋 🥚';}round.items++;bump('cow');return '擠了一瓶牛奶 🥛';}});}
function quitRound(){if(!round)return;clearTimer();if(cur)cur.done=true;if(round.ok===0&&round.items===0){round=null;cur=null;closeModal();toast('下次再來玩！');return;}round.n=round.i;endRound();}
function endRound(){const chick=round.mode==='chicken';const val=chick?3:8;const earn=round.items*val;S.coins+=earn;if(chick){S.eggs+=round.items;bump('chicken');}else S.milk+=round.items;saveSoon();cur=null;
  openModal(`${head(chick?'🐔':'🐄',chick?'快問結束':'複習結束','',false)}<div class="mbody"><div class="bigico">${chick?'🥚':'🥛'}</div><div class="big">答對 ${round.ok} / ${round.n} 題</div>
   <p class="center">${chick?`收了 ${round.items} 顆蛋`:`擠了 ${round.items} 瓶牛奶`}，賣得 <b>🪙 ${earn}</b></p>${!chick&&round.ok?`<p class="center small">同一題再答對一次就能從錯題本畢業。</p>`:''}
   <div class="mfoot"><button class="btn sec" data-act="close">回農場</button><button class="btn" data-act="${chick?'chicken':'cow'}" ${!chick&&!S.wrong.length?'disabled':''}>再來一輪</button></div></div>`);round=null;}
function nameModal(first){openModal(`${head('👒',first?'歡迎來到數學農場！':'改名字','',false)}<div class="mbody"><p>${first?'你是這座農場的新主人。先幫自己取個名字吧：':'新的名字：'}</p><form class="numrow" id="namef"><input id="nm" maxlength="8" autocomplete="off" placeholder="最多 8 個字" value="${esc(S.name)}" aria-label="名字"><button class="btn" type="submit">${first?'開始經營農場':'確定'}</button></form></div>`);
  $('namef').addEventListener('submit',e=>{e.preventDefault();const v=$('nm').value.trim().slice(0,8);if(!v){$('nm').focus();return;}S.name=v;saveSoon();closeModal();if(first)howtoModal();});}
function howtoModal(){openModal(`${head('📖','怎麼玩')}<div class="mbody"><ul class="howto">
  <li><b>走路</b>：方向鍵或 W A S D，也可以直接用滑鼠點地圖。<b>動作</b>：面對東西按空白鍵。</li>
  <li><b>種田</b>：每種作物對應講義一個單元，答對題目澆水。澆 2 次後過一段時間（遊戲裡 1 整天）會自己成熟，想馬上收成就再答 1 題。當季作物會多收成 1 個。答錯作物會生病，看完講解後答對同一題就能治好。</li>
  <li><b>時間與天氣</b>：一天大約 8 分鐘，答題時時間會暫停。下雨會幫作物澆水，晚上 6 點以後可以回家睡覺。颱風會把田吹壞，先蓋「防風網」；烏鴉會來偷吃，答題趕走牠或蓋「稻草人」。晴朗的夜晚偶爾有流星雨，可以撿星星碎片。</li>
  <li><b>吃東西</b>：上面的 🍙 是飽足度，按 C 吃倉庫裡的東西。餓暈的話要付醫藥費或答題。</li>
  <li><b>擴建</b>：Lv 3 可以買右邊的「海邊」（釣海魚、撿貝殼），Lv 4 可以買上面的「果園」（種果樹）。買地前要先算對土地的價錢。</li>
  <li><b>買賣</b>：🛒 旅行商人賣當季水果；🧺 收購站馬上收購（市價 7 成）；🏪 自己的商店可以自己訂價，訂太貴客人不買。</li>

const AU={ctx:null,sfxG:null,musG:null,timer:0,next:0,step:0,mel:4};
function audioInit(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});return;}
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AU.ctx=new C();AU.sfxG=AU.ctx.createGain();AU.musG=AU.ctx.createGain();AU.sfxG.connect(AU.ctx.destination);AU.musG.connect(AU.ctx.destination);audioApply();}catch(e){AU.ctx=null;}}
function audioApply(){if(!AU.ctx)return;AU.sfxG.gain.value=CFG.sfx?CFG.vol/100*0.9:0;AU.musG.gain.value=CFG.music?CFG.musicVol/100*0.35:0;if(CFG.music)musicStart();else musicStop();}
function tone(f,dur,type='sine',vol=0.3,when=0,dest){const c=AU.ctx;if(!c)return;const t=c.currentTime+when;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest||AU.sfxG);o.start(t);o.stop(t+dur+0.05);}
function noise(dur,vol,when=0,hp=800){const c=AU.ctx;if(!c)return;const t=c.currentTime+when;const b=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=c.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AU.sfxG);s.start(t);}
const SFX={ok(){tone(784,.12,'triangle',.28);tone(1175,.22,'triangle',.26,.1);},bad(){tone(262,.22,'triangle',.22);tone(208,.3,'triangle',.2,.14);},coin(){tone(1318,.07,'square',.06);tone(1760,.14,'square',.06,.06);},
  pop(){tone(523,.08,'sine',.3);tone(784,.12,'sine',.22,.05);},shoot(v=1){noise(.14,.18*v,0,1800);tone(900,.08,'sine',.05*v);},hit(){tone(196,.1,'square',.1);noise(.06,.12,0,400);},
  lvl(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.24,'triangle',.22,i*.09));},click(){tone(990,.035,'sine',.1);},start(){[392,523,659,784].forEach((f,i)=>tone(f,.3,'triangle',.2,i*.12));}};

function musicStop(){clearInterval(AU.timer);AU.timer=0;}
function musicTick(){const c=AU.ctx;if(!c)return;const beat=60/84/2;while(AU.next<c.currentTime+0.4){const s=AU.step,when=AU.next-c.currentTime;const bar=Math.floor(s/8)%8,ch=PROG[Math.floor(bar/2)%4];

  const ta=$('svcode');ta.focus();ta.select();}
function svImport(){openModal(`${head('💾','匯入存檔','貼上從別的版本匯出的代碼')}<div class="mbody"><textarea id="svin" class="svbox" placeholder="把 MATHFARM1: 開頭的代碼貼在這裡"></textarea>
   <p class="small">或是選擇之前下載的存檔檔案：<input type="file" id="svfile" accept=".txt,text/plain"></p><p class="small" id="svmsg"></p>
   <div class="mfoot"><button class="btn sec" data-act="svback">← 回設定</button><button class="btn" data-act="svdo">匯入</button></div></div>`);}
let svPend=null;
function svParse(txt){txt=(txt||'').trim().replace(/\s+/g,'');if(!txt.startsWith('MATHFARM1:'))throw new Error('代碼開頭應該是 MATHFARM1:');const o=JSON.parse(b64d(txt.slice(10)));if(!o||!o.slots)throw new Error('代碼內容不完整');return o;}
async function svApply(o){for(const n of [1,2,3]){const d=o.slots[n];if(!d)continue;d.updatedAt=Date.now();try{localStorage.setItem(slotKey(n),JSON.stringify(d));}catch(e){}if(db){try{await db.doc(slotDoc(n)).set(JSON.parse(JSON.stringify(d)));}catch(e){}}}
  if(o.cfg){Object.assign(CFG,o.cfg);saveCfg();audioApply&&audioApply();}await loadSlots();}
document.addEventListener('change',e=>{if(e.target.id==='svfile'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{const ta=$('svin');if(ta)ta.value=String(r.result);};r.readAsText(e.target.files[0]);}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='svexp'){svExport();}
  else if(a==='svimp'){svImport();}
  else if(a==='svback'){backTo();}
  else if(a==='svcopy'){const ta=$('svcode');ta.select();let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true;}catch(err){try{ok=document.execCommand('copy');}catch(e2){}}$('svmsg').textContent=ok?'✅ 已經複製了！':'沒辦法自動複製，請按 Ctrl+C（Mac 按 ⌘+C）複製已選取的代碼。';}
  else if(a==='svdl'){const ta=$('svcode');try{const bl=new Blob([ta.value],{type:'text/plain'});const u=URL.createObjectURL(bl);const l=document.createElement('a');l.href=u;l.download=`數學小農場存檔-${new Date().toISOString().slice(0,10)}.txt`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);$('svmsg').textContent='如果沒有開始下載，請改用「複製代碼」。';}catch(err){$('svmsg').textContent='這裡不能下載，請改用「複製代碼」。';}}
  else if(a==='svdo'){try{const o=svParse($('svin').value);const names=[1,2,3].map(n=>o.slots[n]?`存檔 ${n}：${esc(o.slots[n].name||'未命名')} Lv ${o.slots[n].lv||1}`:null).filter(Boolean);svPend=o;
      openModal(`${head('💾','確定要匯入嗎？','')}<div class="mbody"><p>代碼裡有：</p><ul>${names.map(x=>`<li>${x}</li>`).join('')}</ul><p class="small"><b>同一個格子原本的存檔會被蓋掉。</b>沒有在代碼裡的格子不會動。</p><div class="mfoot"><button class="btn sec" data-act="svimp">取消</button><button class="btn" data-act="svok">確定匯入</button></div></div>`);}
    catch(err){$('svmsg').textContent='❌ 看不懂這串代碼：'+err.message;}}
  else if(a==='svok'){if(!svPend)return;await svApply(svPend);svPend=null;mClose();toast('存檔匯入完成！');menuRender('slots');}
});

</script>

</body></html>
