*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0d0c;color:#dfe3d8;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
.hidden{display:none!important}
.screen{position:fixed;inset:0;overflow:auto;background:radial-gradient(1200px 600px at 20% -10%,#26301f 0%,#0e120d 55%,#080a08 100%);padding:18px;-webkit-overflow-scrolling:touch}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:44px;margin:6px 0 2px;letter-spacing:6px;color:#e8c15a;text-shadow:0 2px 0 #000}
h2{font-size:18px;margin:0 0 10px;color:#e8c15a;letter-spacing:2px}
h3{font-size:14px;margin:10px 0 6px;color:#aab39a;letter-spacing:1px}
.sub{color:#8f9a82;font-size:14px;margin-bottom:22px}
.btn{display:inline-block;background:#3a4a2c;color:#f1f4e6;border:1px solid #5d7345;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer;font-family:inherit;transition:.12s}
.btn:hover{background:#4b6035}
.btn:active{transform:translateY(1px)}
.btn.pri{background:#b8861f;border-color:#e8c15a;color:#fff;font-weight:700}
.btn.pri:hover{background:#cf9a2a}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:6px}
.btn.dng{background:#5a2a24;border-color:#8c4137}
.btn[disabled]{opacity:.4;pointer-events:none}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:8px 8px 0 0;background:#1a2016;border:1px solid #343f2b;color:#aab39a;cursor:pointer;font-size:15px}
.tab.on{background:#2b3a20;color:#fff;border-color:#6e8a4f}
.money{margin-left:auto;font-size:18px;color:#e8c15a;font-weight:700}
.panel{background:rgba(24,30,20,.92);border:1px solid #38442d;border-radius:10px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:#171d14;border:1px solid #333f29;border-radius:9px;padding:10px 12px;position:relative}
.card.on{border-color:#e8c15a;box-shadow:0 0 0 1px #e8c15a55 inset}
.card .nm{font-weight:700;font-size:15px}
.card .ds{font-size:12px;color:#97a28a;margin:3px 0 7px;line-height:1.5}
