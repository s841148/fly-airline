const isItem=id=>id>=256;
const DEF=id=>isItem(id)?ITL[id]:BL[id];
const nameOf=id=>{const d=DEF(id);return d?d.n:'？';};
const iconOf=id=>isItem(id)?ITL[id].ic:(BL[id].tex[1]);
const maxStack=id=>DEF(id).stack||64;
const durOf=d=>d.tool?d.tool.dur:d.armor?d.armor.dur:0;
const fuelOf=id=>{const d=DEF(id);if(!d) return 0;if(d.fuel) return d.fuel;const t=d.tool;if(t&&t.tier===1&&['pick','axe','shovel','sword','hoe'].includes(t.type)) return 10;if(id===B.SAPLING) return 5;return 0;};
function dropOf(id,ok,s){const b=BL[id];if(!ok) return [];const d=b.drop;const ench=s&&s.ench||{};
  if(d==='_none') return [];if(d==='_leaves'){const r=Math.random();return r<0.05?[[B.SAPLING,1]]:r<0.1&&id===B.OAK_LEAVES?[[IT.I_APPLE,1]]:r<0.14?[[IT.I_STICK,1]]:[];}
  if(d==='_grass') return Math.random()<0.125?[[IT.I_SEEDS,1]]:[];if(d==='_gravel') return Math.random()<0.1?[[IT.I_FLINT,1]]:[[B.GRAVEL,1]];
  if(d==='_fc'){const K=b.fcrop.toUpperCase();return b.crop===3?[[IT['I_'+K],K==='STRAWB'||K==='CORN'?irand(1,2):1]]:[[IT['I_'+K+'_S'],1]];}
  if(d==='_wheat') return b.crop===3?[[IT.I_WHEAT,1],[IT.I_SEEDS,irand(1,3)]]:[[IT.I_SEEDS,1]];
  if(d==='_snow') return [[IT.I_SNOWBALL,4]];if(d==='_amethyst') return [[IT.I_AMETHYST,irand(2,4)]];
  if(d==='_palm'){const r=Math.random();return r<0.1?[[IT.I_COCONUT,1]]:r<0.15?[[B.SAPLING,1]]:[];}if(d==='_skyleaves'){const r=Math.random();return r<0.08?[[IT.I_SKYHONEY,1]]:[];}
  if(d==='_carrot') return b.crop===3?[[IT.I_CARROT,irand(2,4)]]:[[IT.I_CARROT,1]];if(d==='_potato') return b.crop===3?[[IT.I_POTATO,irand(2,4)]]:[[IT.I_POTATO,1]];
  if(d==='_beet') return b.crop===3?[[IT.I_BEET,1],[IT.I_BEETSEED,irand(1,3)]]:[[IT.I_BEETSEED,1]];if(d==='_melon') return [[IT.I_MELON,irand(3,7)]];
  if(d==='_redstone') return [[IT.I_REDSTONE,irand(4,5)+(ench.fortune?irand(0,ench.fortune):0)]];if(d==='_lapis') return [[IT.I_LAPIS,irand(4,8)]];
  if(d==='_glow') return [[IT.I_GLOWDUST,irand(2,4)]];if(d==='_books') return [[IT.I_BOOK,3]];
  if(d) return [[d.startsWith('I_')?IT[d]:B[d],1+(ench.fortune&&(id===B.COAL_ORE||id===B.DIAMOND_ORE)?irand(0,ench.fortune):0)]];return [[id,1]];}

function matchRecipe(grid,w){const cells=[];for(let i=0;i<grid.length;i++) if(grid[i]) cells.push(i);if(!cells.length) return null;

  for(const r of RECIPES){if(r.mod&&!modOn(r.mod)) continue;if(r.shapeless){if(r.shapeless.length===ids.length&&r.shapeless.slice().sort((a,b)=>a-b).every((v,i)=>v===ids[i])) return r;continue;}
    const rh=r.rows.length,rw=Math.max(...r.rows.map(s=>s.length));if(rh!==y1-y0+1||rw!==x1-x0+1) continue;
    for(const mir of [false,true]){let ok=true;for(let y=0;y<rh&&ok;y++)for(let x=0;x<rw&&ok;x++){const ch=(r.rows[y][mir?rw-1-x:x]||' ');const want=ch===' '?0:r.key[ch];const s=grid[(y0+y)*w+x0+x];if((s?s.id:0)!==want) ok=false;}if(ok) return r;}}
  return null;}

function addItem(id,n,extra){if(typeof advItem==='function') advItem(id);const inv=P.inv;const ms=maxStack(id);if(ms>1&&!(extra&&extra.ench)) for(let i=0;i<36&&n>0;i++){const s=inv[i];if(s&&s.id===id&&!s.ench&&s.n<ms){const k=Math.min(n,ms-s.n);s.n+=k;n-=k;}}
  for(let i=0;i<36&&n>0;i++) if(!inv[i]){const k=Math.min(n,ms);inv[i]=Object.assign({id,n:k},extra&&extra.d?{d:extra.d}:{},extra&&extra.ench?{ench:{...extra.ench}}:{},extra&&extra.bag?{bag:extra.bag}:{});n-=k;}
  if(typeof renderHotbar==='function') renderHotbar();return n;}
function countItem(id){return P.inv.reduce((a,s)=>a+(s&&s.id===id?s.n:0),0);}
function takeItem(id,n){for(let i=35;i>=0&&n>0;i--){const s=P.inv[i];if(s&&s.id===id){const k=Math.min(n,s.n);s.n-=k;n-=k;if(!s.n) P.inv[i]=null;}}renderHotbar();}
function consumeHeld(n){if(W.mode==='creative') return;const s=held();if(!s) return;s.n-=(n||1);if(s.n<=0) P.inv[P.sel]=null;renderHotbar();}

function tipOf(s){if(!s) return '';const d=DEF(s.id);const L=[nameOf(s.id)];for(const e of enchList(s)) L.push('§'+e);if(d.armor) L.push('防禦 +'+d.armor.def);if(d.tool&&d.tool.dmg>1&&d.tool.type!=='bow') L.push('攻擊 '+d.tool.dmg);const du=durOf(d);if(du&&s.d) L.push(`耐久 ${du-s.d}/${du}`);if(d.food) L.push('飽食 +'+d.food);return L.join('\n');}

function slotGet(c,i){if(c==='inv') return P.inv[i];if(c==='arm') return P.armor[i];if(c==='cg') return UI.cg[i];if(c==='ch') return W.cont[UI.key][i];
  if(c==='fi'||c==='ff'||c==='fo') return W.furn[UI.key][{fi:'in',ff:'fuel',fo:'out'}[c]];if(c==='bp') return UI.bag[i];if(c==='tm') return TR.mine[i];if(c==='tt') return null;if(c==='co2') return W.cont[UI.key][6];if(c==='ei') return UI.ench.item;if(c==='el') return UI.ench.lapis;if(c==='a0'||c==='a1') return UI.anvil[c==='a0'?0:1];return null;}
function slotSet(c,i,s){if(s&&!s.n) s=null;if(c==='inv') P.inv[i]=s;else if(c==='arm') P.armor[i]=s;else if(c==='cg') UI.cg[i]=s;else if(c==='ch'){W.cont[UI.key][i]=s;netCont(UI.key);}
  else if(c==='fi'||c==='ff'||c==='fo'){W.furn[UI.key][{fi:'in',ff:'fuel',fo:'out'}[c]]=s;netFurn(UI.key);}else if(c==='bp') UI.bag[i]=s;else if(c==='tm'){TR.mine[i]=s;trChanged();}else if(c==='co2'){W.cont[UI.key][6]=s;netCont(UI.key);}else if(c==='ei') UI.ench.item=s;else if(c==='el') UI.ench.lapis=s;else if(c==='a0'||c==='a1') UI.anvil[c==='a0'?0:1]=s;}
const sameStack=(a,b)=>a&&b&&a.id===b.id&&!a.ench&&!b.ench&&!a.d&&!b.d;
function canPut(c,i,s){if(c==='tt'||c==='co2') return false;if((c==='bp'||c==='ch')&&DEF(s.id).bag) return false;if(c==='arm') return DEF(s.id).armor&&DEF(s.id).armor.slot===i;if(c==='fo'||c==='co'||c==='ao') return false;if(c==='el') return s.id===IT.I_LAPIS;if(c==='ei') return !!enchKind(s.id)&&!s.ench;return true;}
function clickSlot(c,i,btn,shift){
  if(c==='co'){craftTake(shift);return;}if(c==='ao'){anvilTake();return;}
  if(c==='cr'){const id=+i;const n=btn===2?1:maxStack(id);if(shift){addItem(id,n);return;}UI.cursor={id,n};return;}
  const s=slotGet(c,i);
  if(shift&&s){quickMove(c,i);return;}
  const cur=UI.cursor;
  if(btn===2){if(cur){if(!canPut(c,i,cur)) return;if(!s){slotSet(c,i,{...cur,n:1});cur.n--;}else if(sameStack(s,cur)&&s.n<maxStack(s.id)){s.n++;cur.n--;slotSet(c,i,s);}if(cur.n<=0) UI.cursor=null;}
    else if(s){const half=Math.ceil(s.n/2);UI.cursor={...s,n:half};s.n-=half;slotSet(c,i,s.n?s:null);}return;}
  if(cur){if(!canPut(c,i,cur)){if(c==='fo'&&!cur) return;return;}
    if(s&&sameStack(s,cur)){const k=Math.min(cur.n,maxStack(s.id)-s.n);s.n+=k;cur.n-=k;slotSet(c,i,s);if(cur.n<=0) UI.cursor=null;}
    else{slotSet(c,i,cur);UI.cursor=s||null;}}
  else if(s){UI.cursor=s;slotSet(c,i,null);}}
function putInto(arr,from,to,s){const ms=maxStack(s.id);if(ms>1) for(let i=from;i<to&&s.n;i++){const t=arr[i];if(sameStack(t,s)&&t.n<ms){const k=Math.min(s.n,ms-t.n);t.n+=k;s.n-=k;}}for(let i=from;i<to&&s.n;i++) if(!arr[i]){arr[i]={...s};s.n=0;}return s.n;}
function quickMove(c,i){const s=slotGet(c,i);if(!s) return;let left;
  if(c==='inv'){const k=UI.kind;
    if(k==='chest'||k==='hopper'||k==='share'){left=putInto(W.cont[UI.key],0,W.cont[UI.key].length,s);netCont(UI.key);}
    else if(k==='cook'){left=putInto(W.cont[UI.key],0,6,s);netCont(UI.key);}
    else if(k==='ptrade'){left=putInto(TR.mine,0,9,s);trChanged();}
    else if(k==='bag'&&!DEF(s.id).bag){left=putInto(UI.bag,0,UI.bag.length,s);}
    else if(k==='furnace'){const f=W.furn[UI.key];const tgt=SMELT[s.id]?'in':fuelOf(s.id)?'fuel':null;left=s.n;if(tgt){if(!f[tgt]){f[tgt]={...s};left=0;}else if(sameStack(f[tgt],s)){const k2=Math.min(s.n,64-f[tgt].n);f[tgt].n+=k2;left=s.n-k2;}netFurn(UI.key);}}
    else if(DEF(s.id).armor&&!P.armor[DEF(s.id).armor.slot]){P.armor[DEF(s.id).armor.slot]={...s};left=0;}
    else left=i<9?putInto(P.inv,9,36,s):putInto(P.inv,0,9,s);}
  else left=putInto(P.inv,0,36,s);

function craftTake(shift){const w=UI.kind==='table'?3:2;let r=matchRecipe(UI.cg,w);if(!r) return;

function recipeBook(w){const seen=new Set(),list=[];for(const r of RECIPES){if(r.mod&&!modOn(r.mod)) continue;if(seen.has(r.out)) continue;if(!r.shapeless&&(r.rows.length>w||Math.max(...r.rows.map(x=>x.length))>w)) continue;if(r.shapeless&&r.shapeless.length>w*w) continue;seen.add(r.out);list.push(r);}
  const need=r=>{const m={};if(r.shapeless) r.shapeless.forEach(id=>m[id]=(m[id]||0)+1);else r.rows.forEach(row=>[...row].forEach(ch=>{if(ch!==' '){const id=r.key[ch];m[id]=(m[id]||0)+1;}}));return m;};

  for(const e of ENTS) if((e.kind==='drop'||e.kind==='xp')&&Math.hypot(e.x-x,e.y-y,e.z-z)<pow) {e.vy+=6;}}

function mobUse(m,s){const T2=MOBS[m.type];const id=s&&s.id;

  for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++){const c=getChunk(cx0+a,cz0+b,true);if(!c) continue;for(let i=0;i<c.data.length;i++){if(c.data[i]!==pid) continue;const lx=i&15,lz=(i>>4)&15,y=i>>8;

  if(W.dim==='nether'){for(let yy=32;yy<H-8;yy++){let ok=true;for(let a=-1;a<=3&&ok;a++)for(let j=0;j<5&&ok;j++) if(BL[getB(x+a,yy+j,z)].solid||getB(x+a,yy+j,z)===B.LAVA) ok=false;if(ok){y=yy;break;}}if(y===null) y=64;}

function randomTicks(dt){rtT+=dt;if(rtT<0.1) return;rtT=0;const pcx=Math.floor(P.x)>>4,pcz=Math.floor(P.z)>>4;

const IMMOVABLE=new Set();
function movable(id){if(!IMMOVABLE.size) for(const k of ['BEDROCK','OBSIDIAN','PORTAL','SKY_PORTAL','PISTON_HEAD','CHEST','FURNACE','FURNACE_ON','HOPPER','ENCH','DRILL','HARVESTER','SPAWNER']) IMMOVABLE.add(B[k]);const b=BL[id];return !IMMOVABLE.has(id)&&b.h>=0;}
function pistonUpdate(x,y,z,id,pow){const mk=W.dim+':'+pk(x,y,z);const m=W.meta[mk]||(W.meta[mk]={f:2,ext:false});const [dx,dy,dz]=N6[m.f];
  if(pow&&!m.ext){const list=[];let cx=x+dx,cy=y+dy,cz=z+dz;for(let k=0;k<13;k++){const b=getB(cx,cy,cz);if(!b||BL[b].liquid||BL[b].replace||BL[b].cross&&b!==B.LANTERN&&b!==B.CRYSTAL){break;}if(!movable(b)||k===12){return;}list.push([cx,cy,cz,b]);cx+=dx;cy+=dy;cz+=dz;}
    if(cy<1||cy>=H) return;for(let i=list.length-1;i>=0;i--){const [a,b,c,bid]=list[i];setB(a+dx,b+dy,c+dz,bid,{local:true});}setB(x+dx,y+dy,z+dz,B.PISTON_HEAD,{local:true});m.ext=true;playSnd('door',0.8);}
  else if(!pow&&m.ext){if(getB(x+dx,y+dy,z+dz)===B.PISTON_HEAD) setB(x+dx,y+dy,z+dz,0,{local:true});m.ext=false;
    if(id===B.STICKY_PISTON){const b=getB(x+2*dx,y+2*dy,z+2*dz);if(b&&movable(b)&&!BL[b].liquid){setB(x+dx,y+dy,z+dz,b,{local:true});setB(x+2*dx,y+2*dy,z+2*dz,0,{local:true});}}playSnd('door',0.6);}}

// ================= 流動的水和熔岩 =================
const LIQ={q:new Map(),t:0,busy:false};
const FLOWS={w:null,l:null};
function flowIds(){if(!FLOWS.w){FLOWS.w=[B.WATER,B.WATER_F1,B.WATER_F2,B.WATER_F3,B.WATER_F4,B.WATER_F5,B.WATER_F6,B.WATER_F7];FLOWS.l=[B.LAVA,B.LAVA_F1,B.LAVA_F2,B.LAVA_F3];}return FLOWS;}
const LMAX={w:7,l:3},LDELAY={w:0.25,l:1.5};
function liqQ(x,y,z,d){if(y<1||y>=H) return;const k=x+','+y+','+z;const due=LIQ.t+d;const o=LIQ.q.get(k);if(o===undefined||o>due) LIQ.q.set(k,due);}
function liqWake(x,y,z){if(typeof isHost==='function'&&!isHost()) return;for(const [a,b,c] of [[0,0,0],...N6]){const id=getB(x+a,y+b,z+c);const bb=BL[id];if(bb.liquid) liqQ(x+a,y+b,z+c,LDELAY[bb.kind]||0.25);}}
const replL=id=>{if(!id) return true;const b=BL[id];if(b.liquid) return false;if(b.portal||b.panel||b.rail||id===B.LADDER) return false;return !!(b.replace||(b.cross&&!b.solid));};
function washAway(x,y,z,id){if(!id||BL[id].liquid) return;for(const [d,n] of dropOf(id,true,null)) if(n>0) spawnDrop(d,n,x+0.5,y+0.5,z+0.5);}
function setLiq(x,y,z,kind,lvl){const F=flowIds()[kind];const cur=getB(x,y,z);const cb=BL[cur];
  if(cb.liquid&&cb.kind!==kind){if(kind==='w'){setB(x,y,z,cb.lvl===0?B.OBSIDIAN:B.COBBLE);}else setB(x,y,z,B.COBBLE);playSnd('hiss',0.4);puff(x+0.5,y+1,z+0.5,0xdddddd,5);return;}
  if(!cb.liquid) washAway(x,y,z,cur);setB(x,y,z,F[lvl]);liqQ(x,y,z,LDELAY[kind]);}
const isFalling=(x,y,z,kind)=>BL[getB(x,y+1,z)].kind===kind;
function liqProcess(x,y,z){let id=getB(x,y,z);let b=BL[id];if(!b.liquid) return;const kind=b.kind,MX=LMAX[kind],F=flowIds()[kind];
  // 水碰到熔岩
  for(const [a,c,d] of N6){const n=getB(x+a,y+c,z+d);const nb=BL[n];if(nb.liquid&&nb.kind!==kind){if(kind==='l'){setB(x,y,z,b.lvl===0?B.OBSIDIAN:B.COBBLE);playSnd('hiss',0.4);puff(x+0.5,y+1,z+0.5,0xdddddd,5);return;}}}
  if(W.dim==='nether'&&kind==='w'){setB(x,y,z,0);puff(x+0.5,y+0.5,z+0.5,0xffffff,6);return;}
  let lvl=b.lvl;
  if(lvl>0){let want=null;if(isFalling(x,y,z,kind)) want=1;else{let best=99,src=0;
      for(const [a,c] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=getB(x+a,y,z+c);const nb=BL[n];if(nb.kind!==kind) continue;if(nb.lvl===0) src++;
        const nFall=isFalling(x+a,y,z+c,kind);const below=getB(x+a,y-1,z+c);const canDown=replL(below)||(BL[below].kind===kind&&BL[below].lvl>0&&!isFalling(x+a,y-1,z+c,kind)&&false);
        const eff=nFall?0:nb.lvl;if(nb.lvl===0||nFall||!replL(below)) best=Math.min(best,eff+1);}
      if(kind==='w'&&src>=2&&(BL[getB(x,y-1,z)].solid||getB(x,y-1,z)===B.WATER)) want=0;else if(best<=MX) want=best;}
    if(want===null){setB(x,y,z,0);return;}
    if(want!==lvl){setB(x,y,z,F[want]);lvl=want;}}
  // 往下流
  const below=getB(x,y-1,z);const bb=BL[below];
  if(y>1&&(replL(below)||(bb.kind===kind&&bb.lvl>1)||(bb.liquid&&bb.kind!==kind))){setLiq(x,y-1,z,kind,1);if(lvl>0) return;}
  // 往旁邊流
  const eff=lvl>0&&isFalling(x,y,z,kind)?0:lvl;if(eff>=MX) return;if(lvl>0&&(replL(below)||bb.kind===kind)) return;
  for(const [a,c] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=getB(x+a,y,z+c);const nb=BL[n];
    if(replL(n)) setLiq(x+a,y,z+c,kind,eff+1);else if(nb.kind===kind&&nb.lvl>eff+1) setLiq(x+a,y,z+c,kind,eff+1);else if(nb.liquid&&nb.kind!==kind) setLiq(x+a,y,z+c,kind,eff+1);}}
function liquidTick(dt){if(typeof isHost==='function'&&!isHost()) {LIQ.q.clear();return;}LIQ.t+=dt;if(!LIQ.q.size) return;let n=0;const due=[];
  for(const [k,t] of LIQ.q){if(t<=LIQ.t){due.push(k);if(due.length>=300) break;}}
  for(const k of due){LIQ.q.delete(k);const [x,y,z]=k.split(',').map(Number);if(Math.abs(x-P.x)>80||Math.abs(z-P.z)>80) continue;liqProcess(x,y,z);n++;}}

// ================= 多人連線（房間代碼）=================
const DIMS=['over','nether','sky'];
const NET={on:false,host:false,myId:'me',code:'',peers:new Map(),conns:new Map(),hc:null,peer:null,bc:null,n:0,outSets:[],tP:0,tMob:0,tTime:0,tFurn:0,furnSnap:{},tInv:0,status:'',ver:'202611141400'};
const QS=new URLSearchParams(location.search);
function mkCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)];return s;}
function peerOpts(){const o={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
  if(QS.get('ph')){o.host=QS.get('ph');o.port=+(QS.get('pp')||9000);o.path=QS.get('ppath')||'/';o.secure=QS.get('ps')==='1';}return o;}
const useBC=()=>QS.get('bc')==='1'||typeof Peer==='undefined';
// 包裝連線：大訊息切片
function wrapConn(sendRaw,closeRaw){const w={parts:{},send(o){let s;try{s=JSON.stringify(o);}catch(e){return;}if(s.length<15000){sendRaw(s);return;}const id=Math.random().toString(36).slice(2,9);const n=Math.ceil(s.length/15000);for(let i=0;i<n;i++) sendRaw(JSON.stringify({t:'_pt',id,i,n,s:s.slice(i*15000,(i+1)*15000)}));},
  recv(d,cb){let o;try{o=typeof d==='string'?JSON.parse(d):d;}catch(e){return;}if(o.t==='_pt'){const a=w.parts[o.id]||(w.parts[o.id]={n:0,a:[]});if(a.a[o.i]===undefined){a.a[o.i]=o.s;a.n++;}if(a.n===o.n){delete w.parts[o.id];try{cb(JSON.parse(a.a.join('')));}catch(e){console.warn(e);}}return;}cb(o);},close:closeRaw||(()=>{})};return w;}
// ---- 開房間 ----
function netHost(cb){if(NET.on) {cb&&cb(NET.code);return;}NET.code=mkCode();NET.host=true;NET.myId='H';NET.n=0;W.pinv=W.pinv||{};
  const ready=()=>{NET.on=true;NET.status='host';toast(`房間已開啟！房間代碼：${NET.code}`);netUI();cb&&cb(NET.code);};
  if(useBC()){NET.bc=new BroadcastChannel('mmvox-'+NET.code);NET.bc.onmessage=ev=>{const {from,to,s}=ev.data||{};if(to!=='H') return;let c=NET.conns.get(from);
      if(!c){c=wrapConn(str=>NET.bc.postMessage({from:'H',to:from,s:str}));c.cid=from;NET.conns.set(from,c);}c.recv(s,o=>hostRecv(o,from));};ready();return;}
  const p=new Peer('mmvox-'+NET.code.toLowerCase(),peerOpts());NET.peer=p;
  p.on('open',ready);
  p.on('connection',raw=>{raw.on('open',()=>{if(NET.conns.size>=3){raw.send(JSON.stringify({t:'full'}));setTimeout(()=>raw.close(),300);return;}const id='c'+(++NET.n);
    const c=wrapConn(s=>{try{raw.send(s);}catch(e){}},()=>raw.close());c.cid=id;NET.conns.set(id,c);raw.on('data',d=>c.recv(d,o=>hostRecv(o,id)));raw.on('close',()=>hostDrop(id));raw.on('error',()=>hostDrop(id));});});
  p.on('error',e=>{if(e.type==='unavailable-id'){p.destroy();NET.host=false;netHost(cb);return;}toast('連線錯誤：'+(e.type||e.message));if(!NET.on){NET.host=false;cb&&cb(null,e.type||'error');}});
  p.on('disconnected',()=>{try{p.reconnect();}catch(e){}});}
function hostDrop(id){const c=NET.conns.get(id);if(!c) return;NET.conns.delete(id);const p=NET.peers.get(id);if(p){if(p.model) scene.remove(p.model.g);toast(`${p.name} 離開了遊戲`);NET.peers.delete(id);}hostBcast({t:'pleave',id});netUI();}
function hostBcast(o,except){for(const [id,c] of NET.conns) if(id!==except&&NET.peers.has(id)) c.send(o);}
function hostRecv(o,from){const p=NET.peers.get(from);
  if(o.t==='join'){if(o.ver!==NET.ver){NET.conns.get(from).send({t:'kick',why:'遊戲版本跟房主不一樣，請重新整理網頁（或用房主傳的最新檔案）再加入'});return;}
    let name=String(o.name||'玩家').slice(0,16);if(name===SET.name||[...NET.peers.values()].some(q=>q.name===name)) name+=from.slice(1);
    NET.peers.set(from,{name,color:o.color||'#3a6aa8',st:null,sleeping:false});const saved=W.pinv&&W.pinv[name];
    NET.conns.get(from).send({t:'welcome',id:from,ver:NET.ver,seed:W.seed,wname:W.name,mode:W.mode,diff:W.diff,time:W.time,day:W.day,rain:WX.rain,mods:W.mods,cont:W.cont,furn:W.furn,meta:W.meta,island:W.island,farm:W.farm,fm:W.fm,rules:hostRules(),wd:W.wd||null,spawn:W.spawn,host:{name:SET.name,color:P.color},
      players:[...NET.peers].filter(([id])=>id!==from).map(([id,q])=>({id,name:q.name,color:q.color,st:q.st})),saved});
    hostBcast({t:'pjoin',id:from,name,color:o.color},from);toast(`${name} 加入了遊戲`);netUI();return;}
  if(!p) return;
  switch(o.t){
    case 'p':p.st=o.st;if(o.st.sw) p.swing=1;hostBcast({t:'p',id:from,st:o.st},from);break;
    case 'pinv':W.pinv[p.name]=o.d;break;
    case 'bye':hostDrop(from);break;
    case 'hitmob':{const m=ENTS.find(e=>e.kind==='mob'&&e.eid===o.id&&!e.dead);if(m&&o.gun) m.hurtT=0;if(m) damageMob(m,o.dmg,{by:from,kx:o.kx,kz:o.kz,fire:o.fire});break;}
    case 'mobuse':{const m=ENTS.find(e=>e.kind==='mob'&&e.eid===o.id&&!e.dead);if(m) mobAct(m,o.act,from);break;}
    case 'egg':spawnMob('chicken',o.x,o.y,o.z,{baby:true});break;
    case 'unmount':spawnMob('horse',o.x,o.y,o.z,Object.assign({},o.data,{saddle:true}));break;
    case 'sleep':p.sleeping=!!o.on;if(o.on) sleepCheck();break;
    default:commonRecv(o,from);hostBcast(Object.assign({},o,{from}),from);}}
// ---- 加入房間 ----
function netJoin(code,cb){code=String(code||'').trim().toUpperCase();if(!/^[A-Z0-9]{5}$/.test(code)){cb(null,'房間代碼是 5 個英文字母或數字');return;}NET.code=code;NET.host=false;
  let done=false;const to=setTimeout(()=>{if(!done){done=true;netLeave(true);cb(null,'找不到這個房間（代碼錯了、主機沒開，或網路擋住了連線）');}},30000);
  const onMsg=o=>{if(o.t==='welcome'&&!done){done=true;clearTimeout(to);NET.on=true;NET.myId=o.id;NET.status='client';cb(o);}else if(o.t==='full'&&!done){done=true;clearTimeout(to);netLeave(true);cb(null,'房間已經滿了（最多 4 人）');}else if(o.t==='kick'){done=true;clearTimeout(to);netLeave(true);cb(null,o.why);}else clientRecv(o);};
  const hello=()=>NET.hc.send({t:'join',name:SET.name,color:P.color,ver:NET.ver});

function chatCmd(msg){const a=msg.slice(1).trim().split(/\s+/);const c=a[0];const ok=W.cheats||W.mode==='creative';const say=t=>toast(t);
  if(c==='help'){say('指令：/time set day|night、/gamemode survival|creative、/give 物品名 數量、/tp x y z、/weather clear|rain、/difficulty 0-3、/summon 生物、/seed、/kill、/spawnpoint');return;}

  else if(c==='give'){const id=findItem(a[1]||'');if(id===undefined){say('找不到這個物品');return;}addItem(id,+a[2]||1);say(`給了你 ${nameOf(id)} ×${+a[2]||1}`);}
  else if(c==='tp'){const [x,y,z]=a.slice(1).map(Number);if([x,y,z].some(isNaN)){say('用法：/tp x y z');return;}P.x=x;P.y=y;P.z=z;P.vy=0;}
  else if(c==='weather'){WX.rain=a[1]==='rain';WX.next=irand(6000,18000);say(WX.rain?'下雨了':'天氣放晴');}

  else if(c==='summon'){const t=Object.keys(MOBS).find(k=>k===a[1]||MOBS[k].n===a[1]);if(!t){say('生物：'+Object.values(MOBS).map(m=>m.n).join('、'));return;}if(!isHost()){say('只有主機可以召喚');return;}const d=lookDir();spawnMob(t,P.x+d.x*3,P.y+0.5,P.z+d.z*3,{});}
  else if(c==='spawnpoint'){W.spawn=[Math.floor(P.x),Math.floor(P.y),Math.floor(P.z)];say('世界重生點已設定');}
  else say('不知道的指令，輸入 /help 看看');}

function onKey(e){if(e.target&&e.target.tagName==='INPUT') return true;
  if(uiOpen==='help'&&(e.code==='KeyH'||e.code==='Escape')){toggleHelp(false);return true;}
  if(e.code==='Escape'){if(uiOpen==='chat'){closeChat();return true;}if(UI.kind){closeUI();return true;}if(running&&!P.dead){if(paused&&!$('#s_pause').hidden) resume();else if(!paused) openPause();else showScreen('pause');}return true;}
  if(!running||paused||P.dead) return false;
  if(e.code==='KeyE'){if(UI.kind) closeUI();else openUI(W.mode==='creative'?'creative':'inv');return true;}
  if(UI.kind){if(/^Digit[1-9]$/.test(e.code)){const sl=document.querySelector('#mcui .sl:hover');if(sl){const c=sl.dataset.c,i=+sl.dataset.i,n=+e.code.slice(5)-1;if(c==='cr'){P.inv[n]={id:+sl.dataset.i,n:maxStack(+sl.dataset.i)};}else{const a=slotGet(c,i),b=P.inv[n];if(c==='fo'&&b) return true;slotSet(c,i,b);P.inv[n]=a;}renderUI();renderHotbar();}}if(e.code==='KeyQ'){const sl=document.querySelector('#mcui .sl:hover');if(sl){const c=sl.dataset.c,i=+sl.dataset.i;const s=slotGet(c,i);if(s&&c!=='cr'){const n=e.ctrlKey?s.n:1;spawnDrop(s.id,n,P.x,P.y+1.5,P.z,s);s.n-=n;slotSet(c,i,s.n?s:null);renderUI();}}}return true;}
  if(uiOpen) return true;
  if(e.code==='KeyH'){toggleHelp();return true;}
  if(e.code==='KeyR'&&typeof gunHeld==='function'&&gunHeld()){if(!gunReload()) toast('沒有子彈可以換了');return true;}
  if(e.code==='KeyJ'&&W.farm){openUI('frel');return true;}
  if(e.code==='F1'){e.preventDefault();document.body.classList.toggle('nohud');return true;}
  if(e.code==='F2'){e.preventDefault();SHOT=true;return true;}
  if(e.code==='KeyM'){SET.mini=SET.mini?0:1;saveSet();$('#mini').hidden=!SET.mini;toast(SET.mini?'小地圖：開':'小地圖：關');return true;}
  if(e.code==='KeyL'){SET.shader=(SET.shader+1)%3;applyShader();saveSet();toast('光影包：'+['關','開','高畫質'][SET.shader]);return true;}
  if(e.code==='KeyV'&&isMember()){toast('只有創作者（房主）可以改模組');return true;}
  if(e.code==='KeyV'){SET.vein=(SET.vein+1)%3;saveSet();toast('連鎖挖掘：'+['關','開（蹲下時）','開（一直）'][SET.vein]);return true;}
  if(e.code==='KeyG'&&(W.cheats||W.mode==='creative')&&!(NET.on&&!NET.host)){W.mode=W.mode==='creative'?'survival':'creative';P.fly=false;hudKey='';toast('遊戲模式：'+(W.mode==='creative'?'創造':'生存'));return true;}
  if(e.code==='Tab'){e.preventDefault();showPlist(true);return true;}
  if(e.code==='KeyB'&&modOn('pack')){const i=P.inv.findIndex(x=>x&&(x.id===IT.I_BACKPACK||x.id===IT.I_BIGPACK));if(i>=0){openBag(P.inv[i]);return true;}toast('你還沒有背包：用 8 個皮革圍住 1 個箱子合成');return true;}
  if(e.code==='KeyT'||e.code==='Enter'){e.preventDefault();openChat('');return true;}if(e.code==='Slash'){e.preventDefault();openChat('/');return true;}
  return false;}

  for(let i=0;i<c.a.length;i++){const t=c.a[i];if(t&&t.id===s.id&&!t.ench&&!s.ench&&!t.d&&!s.d&&t.n<maxStack(s.id)){t.n++;netCont(c.k);return true;}}
  for(let i=0;i<c.a.length;i++) if(!c.a[i]){c.a[i]={...s,n:1};netCont(c.k);return true;}return false;}
function takeOne(c){if(c.t==='furn'){const o=c.f.out;if(!o) return null;const s={...o,n:1};o.n--;if(!o.n) c.f.out=null;netFurn(c.k);return s;}
  for(let i=c.a.length-1;i>=0;i--){const t=c.a[i];if(t){const s={...t,n:1};t.n--;if(!t.n) c.a[i]=null;netCont(c.k);return s;}}return null;}

function rayPlayer(maxD){if(!NET.on) return null;const o=eyePos(),d=lookDir();let best=null,bd=maxD;for(const [id,p] of NET.peers){if(!p.cur||!p.model||!p.model.g.visible) continue;const r=0.45;let t0=0,t1=bd;const mn=[p.cur.x-r,p.cur.y,p.cur.z-r],mx=[p.cur.x+r,p.cur.y+1.9,p.cur.z+r],oo=[o.x,o.y,o.z],dd=[d.x,d.y,d.z];let ok=true;
  for(let k=0;k<3;k++){if(Math.abs(dd[k])<1e-6){if(oo[k]<mn[k]||oo[k]>mx[k]){ok=false;break;}continue;}let a=(mn[k]-oo[k])/dd[k],b=(mx[k]-oo[k])/dd[k];if(a>b)[a,b]=[b,a];t0=Math.max(t0,a);t1=Math.min(t1,b);if(t0>t1){ok=false;break;}}if(ok&&t0<bd){bd=t0;best=p;}}return best;}

function fmInit(){if(!W.fm) W.fm={money:500,crops:{},wet:{},bins:{},rainDay:0,town:null};return W.fm;}

function fmoney(d){if(!W.fm) return;if(isHost()){W.fm.money=Math.max(0,W.fm.money+d);if(NET.on) hostBcast({t:'fmset',v:W.fm.money});}else{W.fm.money=Math.max(0,W.fm.money+d);NET.send({t:'fmoney',d});}}
function farmRecv(o,from){if(!W.fm) return;switch(o.t){
  case 'fmoney':if(NET.host){W.fm.money=Math.max(0,W.fm.money+o.d);hostBcast({t:'fmset',v:W.fm.money});}break;
  case 'fmset':W.fm.money=o.v;break;
  case 'fwet':if(NET.host) W.fm.wet[o.k]=1;break;
  case 'fcrop':if(NET.host) W.fm.crops[o.k]=1;break;
  case 'fbin':if(NET.host) W.fm.bins[o.k]=1;break;
  case 'fspawn':if(NET.host){const e=spawnMob(o.ty,o.x,surfaceY(o.x,o.z),o.z,{});if(e&&o.ty==='horse') e.tamed=from;}break;
  case 'fbub':{const m=ENTS.find(e=>e.eid===o.eid);if(m) fBub(m,o.txt,o.s);}break;
  case 'fpet':if(NET.host){const m=ENTS.find(e=>e.eid===o.id);if(m){m.petDay=W.day;puff(m.x,m.y+1,m.z,0xff6a8a,5);}}break;}}

function farmPlant(h,d){const c=FCROP[d.fseed];if(!c) return true;if(W.farm&&!c.s.includes(seasonNow())){toast(`${c.n}只能在${c.s.map(x=>SEASON[x][1]).join('、')}種`);return false;}

function farmWater(h){if(!h||!h.id){return;}let y=h.y;if(BL[h.id].crop!==undefined) y=h.y-1;let n=0;
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const x=h.x+a,z=h.z+b;const id=getB(x,y,z);if(id===B.FARMLAND){setB(x,y,z,B.FARMLAND_WET);n++;const k=W.dim+':'+x+','+y+','+z;if(W.fm){if(isHost()) W.fm.wet[k]=1;else NET.send({t:'fwet',k});}}if(id===B.FARMLAND||id===B.FARMLAND_WET) puff(x+0.5,y+1.1,z+0.5,0x6ab0f0,2,0.4);}
  armSwing();playSnd('splash',0.4);if(!n&&getB(h.x,y,h.z)!==B.FARMLAND_WET) toast('澆水壺要對著耕地或作物用（先用鋤頭把泥土翻成耕地）');}
function shipLabel(){const k=UI.key||'';const m=k.match(/^(\w+):(-?\d+),(-?\d+),(-?\d+)$/);if(!m||getB(+m[2],+m[3],+m[4])!==B.SHIPBIN) return '箱子';
  if(W.fm&&!W.fm.bins[k]){if(isHost()) W.fm.bins[k]=1;else NET.send({t:'fbin',k});}
  const tot=(W.cont[k]||[]).reduce((a,s)=>a+(s?fPrice(s.id)*s.n:0),0);return `📦 出貨箱：放進來的東西，明天早上會變成錢（預計 ${tot.toLocaleString()} G）`;}
function farmBreak(h,b){if(!W.fm) return;const k=W.dim+':'+h.x+','+h.y+','+h.z;if(b.ship){delete W.fm.bins[k];setTimeout(()=>{delete W.cont[k];netCont(k);},0);}

function farmNewDay(prev){const fm=fmInit();const rained=fm.rainDay===prev;const pos=k=>{const m=k.match(/^(\w+):(-?\d+),(-?\d+),(-?\d+)$/);return m?[m[1],+m[2],+m[3],+m[4]]:null;};
  let earned=0;for(const k in fm.bins){const p=pos(k);if(!p) continue;const a=W.cont[k];if(!a){delete fm.bins[k];continue;}if(getB(p[1],p[2],p[3],p[0])!==B.SHIPBIN){delete fm.bins[k];continue;}
    for(let i=0;i<a.length;i++) if(a[i]){earned+=fPrice(a[i].id)*a[i].n;a[i]=null;}netCont(k);}
  const sea=seasonNow();let grew=0,died=0;
  for(const k in fm.crops){const p=pos(k);if(!p){delete fm.crops[k];continue;}const id=getB(p[1],p[2],p[3],p[0]);const b=BL[id];if(!b||!b.fcrop){delete fm.crops[k];continue;}
    if(p[0]==='over'&&!FCROP[b.fcrop].s.includes(sea)){setB(p[1],p[2],p[3],B.DEADBUSH,{dim:p[0]});delete fm.crops[k];died++;continue;}
    const below=getB(p[1],p[2]-1,p[3],p[0]);if(b.crop<3&&(below===B.FARMLAND_WET||rained&&p[0]==='over')&&Math.random()<FCROP[b.fcrop].gd){setB(p[1],p[2],p[3],id+1,{dim:p[0]});grew++;}}
  for(const k in fm.wet){const p=pos(k);if(p&&getB(p[1],p[2],p[3],p[0])===B.FARMLAND_WET) setB(p[1],p[2],p[3],B.FARMLAND,{dim:p[0]});}fm.wet={};
  fm.money+=earned;if(NET.on) hostBcast({t:'fmset',v:fm.money});
  let msg=`🌅 ${SEASON[sea][0]} ${SEASON[sea][1]}第 ${sday()} 天`+(earned?`｜📦 出貨收入 +${earned.toLocaleString()} G`:'')+(grew?`｜🌱 ${grew} 株作物長大了`:'')+(died?`｜🥀 ${died} 株不合季節的作物枯掉了`:'');
  if(sday()===4) msg+=`｜🎉 今天是「${FEST[sea][1]}」！去找陳村長`;toast(msg);if(NET.on) hostBcast({t:'toast',msg});}

function farmMach(h,s){const b=BL[h.id];const M3=FMACH[b.fm];const k=W.dim+':'+h.x+','+h.y+','+h.z;const mt=W.meta[k];armSwing();

function relOf(k){P.frel=P.frel||{};return P.frel[k]||(P.frel[k]={p:0,t:0,g:[]});}
const hearts=k=>Math.floor(relOf(k).p/250);
function addRel(k,n){const r=relOf(k);const cap=P.frel._married===k?3500:P.frel._dating===k?2500:2000;r.p=clamp(r.p+n,0,cap);}
function giftTaste(t,id){const d=DEF(id);const key=isItem(id)?d.key:'B:'+d.key;if(t.love.includes(key)) return 'love';if(t.like.includes(key)) return 'like';if(d.food&&d.food>=6||FPRICE[key]>=150) return 'like';if(!d.food&&fPrice(id)<=2) return 'dislike';return 'neutral';}
function townTalk(m,s){if(!W.farm){toast('（這位鎮民好像在發呆…）');return;}if(m.fsleep){fBub(m,'💤 Zzz…',3);toast(`${(TOWN[m.wool]||{}).n||'鎮民'}睡著了，明天早上再來吧`);return;}const t=TOWN[m.wool];if(!t) return;UI.npc={eid:m.eid,i:m.wool};m.ai.t=4;m.ai.tx=m.x;m.ai.tz=m.z;
  const r=relOf(t.k);UI.npcLine=null;if(r.t!==W.day){r.t=W.day;addRel(t.k,20);UI.npcLine=pickLine(t);}else UI.npcLine=pickLine(t);
  const ev=TEV[t.k];const n=r.ev||0;if(ev&&n<3&&hearts(t.k)>=[2,4,6][n]){r.ev=n+1;UI.npcLine='💗 '+ev[n];addRel(t.k,50);if(n===2&&TGIFT[t.k]){const id=IT[TGIFT[t.k][0]];if(id!==undefined) addOrDrop({id,n:3});}playSnd('level',0.5);}
  if(m.fs&&m.fs.mode!=='post'){m.fs.mode='idle';m.fs.wait=Math.max(m.fs.wait||0,6);m.vx=m.vz=0;m.yaw=Math.atan2(P.x-m.x,P.z-m.z);}openUI('npc');playSnd('hmm');}
function pickLine(t){const h=hearts(t.k);if(P.frel._married===t.k) return pickR(['今天也要加油喔！','我幫你準備了便當～','有你在，家裡好溫暖。']);
  if(t.bd[0]===seasonNow()&&t.bd[1]===sday()) return '今天是我的生日喔！嘿嘿。';
  if(t.heart&&h>=4&&Math.random()<0.4) return pickR(t.heart);if(festToday()) return `今天是${FEST[seasonNow()][1]}，好期待！`;if(WX.rain&&Math.random()<0.3) return '下雨了，記得別著涼。';return pickR(t.lines);}
const pickR=a=>a[Math.floor(Math.random()*a.length)];
function giftsWeek(k){const r=relOf(k);const wk=Math.floor((W.day-1)/7);return r.g.filter(d=>Math.floor((d-1)/7)===wk).length;}
function npcHTML(){const t=TOWN[UI.npc.i];const r=relOf(t.k);const h=hearts(t.k);const max=t.marry?(P.frel._married===t.k?14:10):8;const s=held();

function questOf(){const r=relOf('_q');if(r.day!==W.day){const pool=[['I_WHEAT',5],['I_EGG',3],['I_COAL',8],['I_IRON',3],['I_COD',2],['I_APPLE',3],['I_CARROT',5],['I_POTATO',5]];for(const k in FCROP) if(FCROP[k].s.includes(seasonNow())) pool.push(['I_'+k.toUpperCase(),k==='turnip'?5:2]);

function farmClick(a){if(a.startsWith('abuy:')){if(typeof armoryBuy==='function') armoryBuy(a.slice(5));return;}const t=UI.npc&&TOWN[UI.npc.i];

    h=`<span class="li">${icHTML(id===B.WIRE||id===B.WIRE_ON?IT.I_REDSTONE:id,28)}</span><span><b>${b.n}</b>${line}${extra}${prog?`<div class="bar"><i style="width:${Math.round(prog*100)}%"></i></div>`:''}<small class="mod">麥麥方塊世界</small></span>`;}
  if(h!==lookKey){lookKey=h;el.innerHTML=h;el.hidden=!h;}}
let last=performance.now(),fpsN=0,fpsT=0,saveT=0,lastSim=performance.now();
function simStep(dt){lastSim=performance.now();
    W.time+=dt*20;if(W.time%24000<dt*20) W.day++;
    if(!paused&&!document.hidden) playerTick(dt);else{P.mvx=P.mvz=0;physics(dt,0,0,false);}
    aimTick();mineTick(dt);useTick(dt);survivalTick(dt);portalTick(dt);
    entitiesTick(dt);if(isHost()){spawnTick(dt);furnTick(dt);}
    rsTick(dt);liquidTick(dt);randomTicks(dt);weatherTick(dt);if(typeof modTick==='function') modTick(dt);netTick(dt);
    saveT+=dt;if(saveT>60){saveT=0;saveWorld(true);}}
// 視窗在背景時瀏覽器會停掉畫面更新：多人連線時仍要讓世界繼續跑
setInterval(()=>{if(running&&NET.on&&performance.now()-lastSim>250){try{simStep(0.1);}catch(e){console.error(e);}}},100);
function frame(now){requestAnimationFrame(frame);let dt=Math.min(0.05,(now-last)/1000);last=now;fpsN++;fpsT+=dt;if(fpsT>=1){if(SET.fps) $('#fps').textContent=fpsN+' FPS';fpsN=0;fpsT=0;}
  try{
  if(title.on){title.a+=dt*0.05;P.yaw=title.a;P.pitch=-0.15;camera.rotation.set(P.pitch,P.yaw,0);camera.position.set(P.x,P.y,P.z);W.time=4000;streamChunks(P.x,P.z,2);updateSky();renderer.render(scene,camera);return;}
  if(!running){renderer.render(scene,camera);return;}
  if(!paused||NET.on) simStep(dt);
  cameraTick(dt);shaderTick(dt);streamChunks(P.x,P.z,isTouch?1:2);updateSky();vmTick(dt);hudTick(dt);lookTick(dt);pingTick(dt);if(typeof lifeTick==='function') lifeTick(dt);miniTick(dt);ambTick(dt);toolInfoTick();$('#spyO').hidden=!(USE.mode==='spy'||keys.KeyZ);
  if(P.hurtT>0) P.hurtT-=dt;
  if(!$('#debug').hidden) $('#debug').textContent=`麥麥方塊世界\nXYZ: ${P.x.toFixed(1)} / ${P.y.toFixed(1)} / ${P.z.toFixed(1)}\n區塊: ${Math.floor(P.x)>>4}, ${Math.floor(P.z)>>4}\n生態域: ${BIOME_ZH[biomeAt(P.x,P.z)]||''}\n維度: ${W.dim==='nether'?'地獄':'主世界'}\n時間: 第 ${W.day} 天 ${Math.floor((W.time%24000)/1000+6)%24} 點\n實體: ${ENTS.length}\n看著: ${AIM.id?nameOf(AIM.id)+` (${AIM.x},${AIM.y},${AIM.z})`:'—'}${NET.on?'\n連線: '+(NET.host?'主機 '+NET.code:'客人'):''}`;
  renderer.autoClear=true;renderer.render(scene,camera);
  if(!P.third&&!P.dead&&!P.sleeping&&!document.body.classList.contains('nohud')&&USE.mode!=='spy'&&!keys.KeyZ&&!(typeof gunAiming==='function'&&gunAiming()&&gunDef(held()).scope)){renderer.autoClear=false;renderer.clearDepth();renderer.render(vmScene,vmCam);renderer.autoClear=true;}
  if(SHOT){SHOT=false;try{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='麥麥方塊世界_截圖_'+Date.now()+'.png';document.body.appendChild(a);a.click();a.remove();toast('已截圖存檔');}catch(e){toast('截圖失敗');}}
  }catch(err){console.error(err);if(!frame.err){frame.err=1;toast('發生錯誤：'+err.message);}}}
// 啟動
applyShader();startTitle();requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){saveWorld(true);if(!paused&&!NET.on) openPause();}});

document.documentElement.style.setProperty('--atl','url('+ATL.toDataURL()+')');

document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('.mcb,.hs');if(b&&!b.disabled) playSnd('uiclick',0.8);},true);
</script>
</body></html>
