<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>斯洛伐克文惡補</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1d2433;--mute:#6b7280;--acc:#0b4ea2;--red:#ee1c25;--ok:#15803d;--bad:#b91c1c;--line:#e5e1d8}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1e222b;--ink:#eef0f4;--mute:#9aa3b2;--acc:#6ea8ff;--line:#2d333e;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.5}
header{padding:18px 16px 8px;max-width:680px;margin:auto}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mute);font-size:14px;margin:0}
.flag{display:inline-block;width:22px;height:14px;vertical-align:-1px;margin-right:6px;background:linear-gradient(#fff 0 33%,var(--acc) 33% 66%,var(--red) 66%);border-radius:2px;border:1px solid var(--line)}
nav{display:flex;gap:6px;max-width:680px;margin:10px auto 0;padding:0 16px;position:sticky;top:0;background:var(--bg);z-index:2;padding-bottom:8px}
nav button{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:600}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:680px;margin:auto;padding:4px 16px 40px}
.tip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--mute);margin:8px 0}
.tip b{color:var(--ink)}
h2{font-size:15px;color:var(--mute);margin:18px 2px 6px;font-weight:600}
.ph{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.ph .t{flex:1;min-width:0}
.sk{font-size:19px;font-weight:700}
.zh{font-size:15px}
.pr{font-size:13px;color:var(--mute)}
.btns{display:flex;gap:6px}
.ic{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center;padding:0}
.ic.slow{font-size:12px;font-weight:700}
.ic.playing{background:var(--acc);color:#fff}
.mark{font-size:12px;color:var(--ok)}
/* practice */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 16px;text-align:center}
.prog{font-size:13px;color:var(--mute);margin-bottom:8px}
.q{font-size:24px;font-weight:700;margin:6px 0 14px}
.ans{display:none;margin:10px 0}
.ans.show{display:block}
.ans .sk{font-size:26px}
.big{display:block;width:100%;padding:13px;border-radius:12px;border:none;background:var(--acc);color:#fff;font-size:16px;font-weight:700;margin-top:8px}
.big.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px}
.row .big{flex:1}
.good{background:var(--ok)!important}
.again{background:var(--bad)!important}
.say{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;text-align:left}
.say label{font-size:13px;color:var(--mute)}
.say input{width:100%;font-size:17px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:4px}
.score{margin-top:8px;font-size:15px;min-height:22px}
.mic{margin-top:8px}
.mic.on{background:var(--bad)}
.modes{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.modes button{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px}
.modes button.on{background:var(--ink);color:var(--bg)}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1><span class="flag"></span>斯洛伐克文惡補</h1>
  <p class="sub">科希策出差用・點 🔊 聽發音，「慢」放慢速度</p>
</header>
<nav>
  <button id="tabLearn" class="on">① 學句子</button>
  <button id="tabPractice">② 反覆練習</button>
</nav>
<main>
  <section id="learn">
    <div class="tip"><b>沒聲音？</b>iPhone 請確認側邊靜音開關沒打開、音量調大。<br><b>發音三原則：</b>重音永遠在<b>第一個音節</b>；字母照拼照念（幾乎沒有不發音的字母）；<b>á é í ó ú ý</b> 上的撇號＝母音拉長，不是重音。<br>中文諧音只是輔助，請以 🔊 的聲音為準。</div>
    <div id="voiceWarn" class="tip hidden"></div>
    <div id="srcBox" class="tip hidden"><b>聲音來源：</b>
      <div class="modes" id="srcModes" style="margin:6px 0 0"></div>
      <div id="srcNote" style="margin-top:4px"></div></div>
    <div id="list"></div>
  </section>

  <section id="practice" class="hidden">
    <div class="modes" id="modes"></div>
    <div class="card">
      <div class="prog" id="prog"></div>
      <div class="pr">請用斯洛伐克文說：</div>
      <div class="q" id="q"></div>
      <div class="ans" id="ans">
        <div class="sk" id="aSk"></div>
        <div class="pr" id="aPr"></div>
        <div class="btns" style="justify-content:center;margin-top:8px">
          <button class="ic" id="aPlay">🔊</button>
          <button class="ic slow" id="aSlow">慢</button>
        </div>
      </div>
      <button class="big" id="reveal">先自己念一次，再看答案</button>
      <div class="row hidden" id="rate">
        <button class="big again" id="bAgain">再練</button>
        <button class="big good" id="bGood">會了 ✓</button>
      </div>
      <div class="say">
        <label>🎙 唸給我聽：按麥克風說出這句，我會用斯洛伐克語辨識並打分數（第一次會詢問麥克風權限）</label>
        <button class="big alt mic hidden" id="mic">🎙 按這裡開始說</button>
        <input id="said" placeholder="你念的會出現在這裡" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="score" id="score"></div>
      </div>
    </div>
    <div class="tip" id="stats" style="margin-top:12px"></div>
  </section>
</main>

let ctts=null, skVoice=null, curBtn=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const v=speechSynthesis.getVoices();
  const sks=v.filter(x=>/^sk/i.test(x.lang));if(sks.length&&!srcSaved)srcMode="dev";skVoice=sks.find(x=>/natural|online|neural|enhanced|premium|vylepš/i.test(x.name))||sks.find(x=>/google/i.test(x.name))||sks[0]||null;renderSrc();
  const w=document.getElementById("voiceWarn");
  if(false){w.textContent="你的裝置沒有斯洛伐克語語音，聲音可能不準。iPhone：設定 › 輔助使用 › 朗讀內容 › 聲音 › 加入「斯洛伐克文」；Android：Google 文字轉語音 › 安裝語音資料 › Slovenčina。";w.classList.remove("hidden")}
  else w.classList.add("hidden");
}
if("speechSynthesis" in window){setTimeout(pickVoice,0);speechSynthesis.onvoiceschanged=pickVoice}
function mark(btn,on){if(curBtn&&curBtn!==btn)curBtn.classList.remove("playing");curBtn=on?btn:null;if(btn)btn.classList.toggle("playing",on)}
const player=new Audio();
let srcMode="rec",srcSaved=false;try{const v=localStorage.getItem("skSrc");if(v){srcMode=v;srcSaved=true}}catch(e){}
function renderSrc(){
  const opts=[["rec","內建錄音（穩定）"]];
  if("speechSynthesis" in window)opts.push(["dev",skVoice?"裝置語音："+skVoice.name.replace(/Microsoft |Online |\(Natural\)| - Slovak \(Slovakia\)/g,"").trim():"裝置語音（Laura）"]);
  if(ctts)opts.push(["claude","Claude 語音"]);
  if(!opts.find(o=>o[0]===srcMode))srcMode="rec";
  const box=document.getElementById("srcBox");if(!box)return;
  box.classList.toggle("hidden",opts.length<2);
  const m=document.getElementById("srcModes");m.innerHTML="";
  opts.forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;if(k===srcMode)b.className="on";
    b.onclick=()=>{srcMode=k;try{localStorage.setItem("skSrc",k)}catch(e){};renderSrc();speak("Dobrý deň",false,null)};m.appendChild(b)});
  let nv=0,ns=0;try{const v=speechSynthesis.getVoices();nv=v.length;ns=v.filter(x=>/^sk/i.test(x.lang)).length}catch(e){}
  document.getElementById("srcNote").textContent="點選後會念一句「Dobrý deň」試聽；若沒聲音就切回內建錄音。（偵測到語音 "+nv+" 個，斯洛伐克語 "+ns+" 個）";
}
async function speak(text,slow,btn){
  const orig=text;
  text=text.replace(" / ",", ").replace("Jia-hao","Ťia Chao");
  mark(btn,true);
  const src=AUD[orig+"|"+(slow?"s":"n")];
  if(src && srcMode==="rec"){
    try{if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}
    player.pause();player.src=src;player.onended=player.onerror=()=>mark(btn,false);
    try{await player.play();return}catch(e){}
  }
  if(ctts && srcMode==="claude"){
    try{await ctts.speak(text,{language:"sk",rate:slow?0.7:0.95});}catch(e){}
    mark(btn,false);return;
  }
  if("speechSynthesis" in window && srcMode==="dev"){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=skVoice?skVoice.lang:"sk-SK"; if(skVoice)u.voice=skVoice;
    u.rate=slow?0.55:0.9;
    u.onend=u.onerror=()=>mark(btn,false);
    speechSynthesis.speak(u);
  }else if(src){player.src=src;player.onended=()=>mark(btn,false);player.play().catch(()=>mark(btn,false))}else mark(btn,false);
}

/* ---------- tabs ---------- */
const tL=document.getElementById("tabLearn"),tP=document.getElementById("tabPractice");
tL.onclick=()=>{tL.classList.add("on");tP.classList.remove("on");learn.classList.remove("hidden");practice.classList.add("hidden")};
tP.onclick=()=>{tP.classList.add("on");tL.classList.remove("on");practice.classList.remove("hidden");learn.classList.add("hidden");if(!cur)next()};

/* ---------- practice ---------- */
const groups=["全部","還不熟的",...P.map(p=>p[0])];let mode="全部";
const modesEl=document.getElementById("modes");
groups.forEach(g=>{const b=document.createElement("button");b.textContent=g;if(g===mode)b.className="on";b.onclick=()=>{mode=g;[...modesEl.children].forEach(x=>x.classList.toggle("on",x===b));deck=[];next()};modesEl.appendChild(b)});
let deck=[],cur=null,round=0;
function pool(){
  if(mode==="全部")return ALL;
  if(mode==="還不熟的"){const p=ALL.filter(x=>(known[x.sk]||0)<2);return p.length?p:ALL}
  return ALL.filter(x=>x.g===mode);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function next(){
  if(!deck.length){deck=shuffle(pool().slice());round++}
  cur=deck.shift();
  q.textContent=cur.zh;aSk.textContent=cur.sk;aPr.textContent=cur.pr;
  ans.classList.remove("show");reveal.classList.remove("hidden");rate.classList.add("hidden");
  said.value="";score.textContent="";
  prog.textContent=`這一輪剩 ${deck.length+1} 句`;
  stats();
}
reveal.onclick=()=>{ans.classList.add("show");reveal.classList.add("hidden");rate.classList.remove("hidden");speak(cur.sk,false,aPlay)};
aPlay.onclick=()=>speak(cur.sk,false,aPlay);aSlow.onclick=()=>speak(cur.sk,true,aSlow);
bGood.onclick=()=>{known[cur.sk]=(known[cur.sk]||0)+1;save();next()};
bAgain.onclick=()=>{known[cur.sk]=0;save();deck.splice(Math.min(2,deck.length),0,cur);next()};
function stats(){const k=ALL.filter(x=>(known[x.sk]||0)>=2).length;document.getElementById("stats").innerHTML=`已熟練（連續答對 2 次）：<b>${k} / ${ALL.length}</b> 句。選「還不熟的」專練弱點。`}

/* ---------- pronunciation check ---------- */
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim()}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function check(){
  const s=norm(said.value);if(!s){score.textContent="";return}
  const t=norm(cur.sk.replace("Jia-hao","jiahao"));
  const pct=Math.max(0,Math.round((1-lev(s,t)/Math.max(s.length,t.length))*100));
  score.innerHTML=pct>=85?`<span style="color:var(--ok)">✅ ${pct}% 很棒！辨識得出來</span>`:pct>=60?`<span style="color:var(--acc)">🙂 ${pct}% 接近了，聽一次慢速再試</span>`:`<span style="color:var(--bad)">🔁 ${pct}% 再練練，先按「慢」跟讀</span>`;
  if(!ans.classList.contains("show")&&pct>=60){ans.classList.add("show");reveal.classList.add("hidden");rate.classList.remove("hidden")}
}
said.addEventListener("input",check);

/* ---------- Claude capabilities (light up if available) ---------- */
let dict=null,listening=false;
(async()=>{
  if(!window.claude||!claude.use)return;
  try{const t=await claude.use("tts");if(t){ctts=t;renderSrc()}}catch(e){}
  try{
    dict=await claude.use("dictation");
    if(dict){
      mic.classList.remove("hidden");
      dict.onPartial(({text})=>{said.value=text;check()});
      dict.onFinal(({text})=>{said.value=text;check()});
      dict.onState(({state})=>{listening=state==="listening";mic.classList.toggle("on",listening);mic.textContent=listening?"■ 說完按這裡停止":"🎙 按這裡開始說"});
    }
  }catch(e){}
})();
/* ---------- browser speech recognition (standalone page) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
if(SR){
  mic.classList.remove("hidden");
  rec=new SR();rec.lang="sk-SK";rec.interimResults=true;rec.maxAlternatives=3;rec.continuous=false;
  rec.onresult=e=>{let best="",bestPct=-1;const r=e.results[e.results.length-1];
    for(let i=0;i<r.length;i++){said.value=r[i].transcript;check();const m=(score.textContent.match(/(\d+)%/)||[])[1];const p=m?+m:0;if(p>bestPct){bestPct=p;best=r[i].transcript}}
    said.value=best;check()};
  rec.onstart=()=>{listening=true;mic.classList.add("on");mic.textContent="■ 說完按這裡停止"};
  rec.onend=()=>{listening=false;mic.classList.remove("on");mic.textContent="🎙 按這裡開始說"};
  rec.onerror=e=>{score.textContent=e.error==="not-allowed"?"請允許使用麥克風與語音辨識後再試":"沒聽清楚，再按一次麥克風試試";};
}
mic.onclick=()=>{
  if(rec){ if(listening){rec.stop();return} said.value="";score.textContent="";try{if("speechSynthesis" in window)speechSynthesis.cancel();player.pause();rec.start()}catch(e){} return;}
  if(!dict)return;
  if(listening){dict.stop().catch(()=>{});return}
  said.value="";score.textContent="";
  dict.start().catch(e=>{if(e&&e.code==="not_granted"){mic.classList.add("hidden")}});
};
</script>
</body>
</html>
